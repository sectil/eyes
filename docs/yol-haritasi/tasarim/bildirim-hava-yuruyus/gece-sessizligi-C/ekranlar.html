}
.t-dark {

}
.shot { padding: 11px; }
.phone { position: relative; width: var(--pw); min-height: var(--ph); border-radius: 46px; overflow: hidden;

.ck-l { font: 600 0.9rem/1 var(--f-body); color: var(--ink-2); }

.stp { display: grid; gap: 8px; }

.core { display: grid; grid-template-columns: 14px minmax(0,1fr); gap: 7px; align-items: start; padding: 0 2px; font: 400 12.5px/1.4 var(--f-body); letter-spacing: -0.005em; color: var(--ink-2); }
.core .ico { width: 14px; height: 14px; margin-top: 2px; color: var(--ink-3); }

/* ---- G2: bilgi notu ---- */
.info { display: grid; grid-template-columns: 20px minmax(0,1fr); gap: 10px; padding: 13px 14px; border-radius: 18px; background: var(--accent-soft); }

.lk-date { text-align: center; font: 600 1.05rem/1 var(--f-body); opacity: 0.92; margin-top: 20px; }

.nt { border-radius: 22px; padding: 12px 14px 14px; display: grid; grid-template-columns: 38px minmax(0,1fr); column-gap: 11px; row-gap: 3px; backdrop-filter: blur(20px); }
.t-light .nt { background: rgba(255,255,255,0.82); color: #0b1219; }

.rows { display: grid; gap: 10px; }

.row { display: grid; grid-template-columns: minmax(0,1fr) auto auto; gap: 14px; align-items: center; padding: 14px 14px 14px 18px; border-radius: 20px; background: var(--c-panel); border: 1px solid var(--border); box-shadow: var(--shadow); }

.play { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--lens); color: var(--lens-ink); }

.sci { padding: 12px 14px; border-radius: 16px; background: var(--surface); border: 1px solid var(--border); font: 400 0.8rem/1.45 var(--f-body); color: var(--ink-2); }
.t-dark .sci { background: rgba(15,23,31,0.82); }

<script>
(function () {
  var caps = { G: 'Varsayılan 23.00–07.00', G2: 'Biter 10.00; 09.30 Mola içeride', B1: '14.30 · tek bildirim, düğmesiz', B2: 'İki satır önce, bilim kartı altta' };
  document.querySelectorAll('.strip').forEach(function (strip) {
    var set = strip.dataset.set;
    ['acik', 'koyu'].forEach(function (th) {
      var cell = document.createElement('figure');
      cell.className = 'cell';
      var shot = document.createElement('div');
      shot.className = 'shot';
      shot.dataset.shot = set + '-' + th;
      shot.style.background = th === 'acik' ? '#eef2f4' : '#070c12';
      var frag = document.getElementById('tpl-' + (set === 'G2' ? 'G' : set)).content.cloneNode(true);
      var ph = frag.querySelector('.phone');
      ph.classList.add(th === 'acik' ? 't-light' : 't-dark');
      if (set === 'G2') {
        ph.querySelector('[data-end]').textContent = '10.00';
        ph.querySelector('[data-plus]').classList.add('off');
        ph.querySelector('.sb span').textContent = '22:16';
        ph.querySelector('[data-info]').replaceWith(document.getElementById('tpl-info').content.cloneNode(true));
        var r = document.createElement('div');
        r.className = 'lr';
        r.innerHTML = '<span class="ri"><svg class="ico"><use href="#i-cup"/></svg></span><b>Mola hatırlatması</b><em>09.30</em>';
        ph.querySelector('[data-list]').appendChild(r);
      } else if (set === 'G') {
        ph.querySelector('[data-info]').remove();
      }
      shot.appendChild(frag);
      cell.appendChild(shot);
      var cap = document.createElement('figcaption');
      cap.className = 'cap';
      cap.textContent = set + ' · ' + (th === 'acik' ? 'açık' : 'koyu') + ' · ' + caps[set];
      cell.appendChild(cap);
      strip.appendChild(cell);
    });
  });
})();
</script>
</body>
</html>
