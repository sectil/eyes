<title>Işıktan Baş</title>
<style>
:root{
  --bg:#f3f6f8; --surface:#fff; --ink:#0b1219; --ink-2:#33414d; --ink-3:#6b7a86; --line:rgba(11,18,25,.09);
  --iris-1:#11a9b8; --iris-2:#2f6bea; --lens:#f08a00; --lens-ink:#b25f00; --ok:#13704b;
  --r-goz:#0e97a6; --r-dikkat:#2f5fe0; --r-nefes:#6a4bd6; --r-ruh:#cf3b7c; --r-hareket:#e07b00;
  --chip:#fff; --chip-on:#fff; --shadow:0 1px 2px rgba(11,18,25,.05),0 6px 18px rgba(11,18,25,.05);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#070c12; --surface:#0f171f; --ink:#eef3f6; --ink-2:#b9c4cd; --ink-3:#7d8b97; --line:rgba(238,243,246,.08);
    --iris-1:#19c2d1; --iris-2:#3e7bfa; --lens:#ffb13b; --lens-ink:#ffb13b; --ok:#35d39a;
    --r-goz:#3fd3df; --r-dikkat:#6f9bff; --r-nefes:#a78bff; --r-ruh:#ff80b5; --r-hareket:#ffb13b;
    --chip:#0d151c; --chip-on:#121d27; --shadow:none;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#070c12; --surface:#0f171f; --ink:#eef3f6; --ink-2:#b9c4cd; --ink-3:#7d8b97; --line:rgba(238,243,246,.08);
  --iris-1:#19c2d1; --iris-2:#3e7bfa; --lens:#ffb13b; --lens-ink:#ffb13b; --ok:#35d39a;
  --r-goz:#3fd3df; --r-dikkat:#6f9bff; --r-nefes:#a78bff; --r-ruh:#ff80b5; --r-hareket:#ffb13b;
  --chip:#0d151c; --chip-on:#121d27; --shadow:none;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:Onest,"SF Pro Text",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.app{max-width:390px;margin:0 auto;padding:10px 16px 28px;display:flex;flex-direction:column}
.seg{display:flex;gap:4px;padding:3px;border-radius:999px;background:var(--line);align-self:center;margin-bottom:10px}
.seg button{font-size:12.5px;font-weight:500;padding:6px 12px;border-radius:999px;color:var(--ink-2);transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.top{display:flex;align-items:baseline;justify-content:space-between;margin:2px 2px 0}
h1{font-family:Unbounded,"SF Pro Display",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-weight:600;font-size:24px;letter-spacing:-.01em}
.day{font-size:13px;font-weight:500;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.day .pulse{width:7px;height:7px;border-radius:50%;background:var(--lens);display:none}
.day.live .pulse{display:inline-block;animation:pl 1s ease-in-out infinite}
@keyframes pl{50%{opacity:.35;transform:scale(.7)}}
.stage{position:relative;height:clamp(250px,47vh,420px);margin:0 -16px;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage::before{content:'';position:absolute;inset:0;pointer-events:none;z-index:1;
  background:radial-gradient(60% 55% at 48% 50%,color-mix(in srgb,var(--iris-2) 9%,transparent),transparent 70%);mix-blend-mode:screen}
:root[data-theme="light"] .stage::before{mix-blend-mode:normal}
.labels{position:absolute;inset:0;pointer-events:none}
.lb{position:absolute;left:0;top:0;font-size:10.5px;font-weight:500;letter-spacing:.02em;white-space:nowrap;
  transform:translate(-50%,-50%);transition:opacity .45s;color:var(--c);opacity:0;text-shadow:0 0 6px var(--bg),0 0 2px var(--bg)}
.lb.on{opacity:1}
.lb.dim{color:var(--ink-3)} .lb.on.dim{opacity:.6}
.nef{display:flex;gap:11px;align-items:flex-start;margin:4px 2px 14px;font-size:15.5px;line-height:1.42;font-weight:500;color:var(--ink);min-height:44px}
.nef .av{flex:none;width:26px;height:26px;border-radius:50%;margin-top:1px;
  background:radial-gradient(circle at 50% 50%,#070c12 0 27%,var(--iris-1) 30%,var(--iris-2) 70%,transparent 73%);
  box-shadow:0 0 0 1.5px var(--iris-2) inset}
.live{color:var(--lens-ink)}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chip{position:relative;text-align:left;background:var(--chip);border-radius:14px;padding:10px 11px 10px;border:1px solid var(--line);
  box-shadow:var(--shadow);display:flex;flex-direction:column;gap:2px;transition:border-color .25s,background .25s,opacity .25s;min-width:0}
.chip.wide{grid-column:1/-1}
.chip .nm{display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:600}
.chip .dt{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none;opacity:.35}
.chip.up .dt,.chip.live .dt{opacity:1;box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 22%,transparent)}
.chip .v{font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .w{font-size:12px;font-weight:600;color:var(--ink-3)}
.chip.up .w{color:var(--ok)}
.chip.live .w{color:var(--lens-ink)}
.chip[aria-pressed="true"]{border-color:var(--c);background:var(--chip-on)}
.chips.focus .chip[aria-pressed="false"]{opacity:.55}
.detail{overflow:hidden;max-height:0;transition:max-height .35s ease,margin .35s;margin-top:0}
.detail.open{max-height:220px;margin-top:10px}
.detail .in{border-radius:14px;padding:12px 13px;background:var(--surface);border:1px solid var(--line);font-size:14px;line-height:1.45;color:var(--ink-2)}
.detail b{color:var(--ink);font-weight:600}
.foot{margin-top:14px;font-size:11.5px;line-height:1.45;color:var(--ink-3)}
.fallback{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:var(--ink-3);font-size:13px}
.nogl .fallback{display:flex}
@media (min-width:430px){.app{margin-top:12px;border-radius:32px;border:1px solid var(--line);background:var(--bg);padding-top:14px}}
@media (prefers-reduced-motion: reduce){.day.live .pulse{animation:none}.detail,.chip,.lb,.seg button{transition:none}}
@media (max-height:600px){.stage{height:clamp(236px,46vh,300px)} .nef{font-size:14.5px;margin-bottom:12px} h1{font-size:21px}}
</style>

<div class="app" id="app">
  <div class="seg" role="group" aria-label="Örnek durum">
    <button data-s="d30" aria-pressed="false">30. gün</button>
    <button data-s="walk" aria-pressed="false">Yürürken</button>
    <button data-s="d1" aria-pressed="false">1. gün</button>
  </div>
  <div class="top"><h1>Gelişim</h1><span class="day" id="day"><i class="pulse"></i><span></span></span></div>
  <div class="stage" id="stage" role="img" aria-label="Işıktan bir baş">
    <canvas id="cv"></canvas>
    <div class="labels" id="labels"></div>
    <div class="fallback">Bu cihazda üç boyutlu görünüm açılamadı.</div>
  </div>
  <p class="nef"><i class="av" aria-hidden="true"></i><span id="nef"></span></p>
  <div class="chips" id="chips"></div>
  <div class="detail" id="detail" aria-live="polite"><div class="in" id="detailIn"></div></div>
  <p class="foot">Bir bölge yalnız verin başlangıcından iyi olduğunda tam yanar. Gözler, ölçülen kırpma hızınla kırpar. Örnek veri.</p>
</div>

<script>
/* ---------------- veri (olduğu gibi) ---------------- */
const AREAS = ['goz', 'dikkat', 'nefes', 'ruh', 'hareket']
const NAME = { goz: 'Göz', dikkat: 'Dikkat', nefes: 'Nefes', ruh: 'Ruh hâli', hareket: 'Hareket' }
const WORD = { start: 'Başlangıç', up: 'Başlangıcından iyi', same: 'Değişim yok', unsure: 'Henüz belli değil', live: 'Şu an' }
const DAYS = {
  '30': { label: '30. gün', blinks: 5, nef: 'Üç alanda başlangıcından iyisin: dikkat, nefes ve ruh hâli.', a: {
    goz: { st: 'same', v: 'E testi 0,20 → 0,20', d: '<b>E testi</b> 6 ölçümde başlangıcınla aynı (küçük değer iyi). İlk Bakış: 20 saniyede 5 kırpma; gözlerin bu hızla kırpıyor.' },
    dikkat: { st: 'up', v: '4 → 6 harf', d: '<b>Tek Bakışta</b> kavradığın harf 14 ölçümde 4\'ten 6\'ya çıktı.' },
    nefes: { st: 'up', v: '+1,3 sakinlik', d: '<b>Nefesten sonra</b> sakinlik puanın 24 oturumda ortalama 1,3 yüksek (5 üzerinden).' },
    ruh: { st: 'up', v: 'İyi oluş 56 → 68', d: '<b>İyi oluş</b> (WHO-5) puanın 56\'dan 68\'e çıktı; 10 puandan büyük fark.' },
    hareket: { st: 'unsure', v: 'Bugün 7.080 adım', d: '<b>Apple Sağlık:</b> bugün 7.080 adım. Adım geçmişi henüz kaydedilmediği için karşılaştırma yok.' },
  } },
  '1': { label: '1. gün', blinks: 3, nef: 'Başlangıcın ölçüldü. Bundan sonraki her ölçüm buna göre yanacak.', a: {
    goz: { st: 'start', v: '20 sn\'de 3 kırpma', d: '<b>İlk Bakış</b> 20 saniyede 3 kırpma ölçtü; gözlerin bu hızla kırpıyor. E testi de alındı.' },
    dikkat: { st: 'start', v: '4 harf', d: '<b>Tek Bakışta</b> ilk ölçümün: 4 harf.' },
    nefes: { st: 'start', v: 'Sakinlik 2 → 4', d: '<b>İlk nefesinde</b> sakinlik puanın 2\'den 4\'e çıktı (5 üzerinden).' },
    ruh: { st: 'start', v: 'İyi oluş 56', d: '<b>İyi oluş</b> (WHO-5) ilk puanın: 56. Sonraki 14. gün.' },
    hareket: { st: 'start', v: 'Bugün 3.412 adım', d: '<b>Apple Sağlık:</b> bugün 3.412 adım.' },
  } },
}
DAYS.walk = JSON.parse(JSON.stringify(DAYS['30']))
Object.assign(DAYS.walk, { label: 'Şu an', nef: '<span class="live">Şu an yürüyorsun:</span> 14 dakikada 1,2 km, 1.690 adım.' })
DAYS.walk.a.hareket = { st: 'live', v: '1.690 adım · 14 dk', d: '<b>Yürüyüş sürüyor:</b> 1,2 km, 1.690 adım. Hareket bölgesi adım temponla akıyor.' }
</script>
<script>
(function(){
'use strict';
const KEY = { d30: '30', walk: 'walk', d1: '1' };
const qs = new URLSearchParams(location.search);
const DBG = qs.get('dbg') || '';
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let stKey = 'd30', sel = null;

/* ================= UI ================= */
const $ = (id) => document.getElementById(id);
const chipsEl = $('chips'), labelsEl = $('labels');
AREAS.forEach((k) => {
  const b = document.createElement('button');
  b.className = 'chip' + (k === 'hareket' ? ' wide' : '');
  b.dataset.k = k; b.style.setProperty('--c', `var(--r-${k})`);
  b.innerHTML = `<span class="nm"><i class="dt"></i>${NAME[k]}</span><span class="v"></span><span class="w"></span>`;
  b.addEventListener('click', () => select(sel === k ? null : k));
  chipsEl.appendChild(b);
  const l = document.createElement('span');
  l.className = 'lb'; l.dataset.k = k; l.style.setProperty('--c', `var(--r-${k})`); l.textContent = NAME[k];
  labelsEl.appendChild(l);
});
document.querySelectorAll('.seg button').forEach((b) => b.addEventListener('click', () => {
  if (location.hash !== '#' + b.dataset.s) history.replaceState(null, '', '#' + b.dataset.s);
  setState(b.dataset.s);
}));
window.addEventListener('hashchange', () => setState(readHash()));
function readHash(){ const h = (location.hash || '').replace('#', '').split('&')[0]; return KEY[h] ? h : 'd30'; }

function setState(k){
  stKey = k; const D = DAYS[KEY[k]];
  document.querySelectorAll('.seg button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.s === k));
  const day = $('day'); day.querySelector('span').textContent = D.label; day.classList.toggle('live', k === 'walk');
  $('nef').innerHTML = D.nef;
  chipsEl.querySelectorAll('.chip').forEach((c) => {
    const a = D.a[c.dataset.k];
    c.className = 'chip ' + a.st + (c.dataset.k === 'hareket' ? ' wide' : '');
    c.querySelector('.v').textContent = a.v; c.querySelector('.w').textContent = WORD[a.st];
    c.setAttribute('aria-label', `${NAME[c.dataset.k]}: ${a.v}, ${WORD[a.st]}`);
  });
  const lit = AREAS.filter((k2) => ['up', 'live'].includes(D.a[k2].st)).map((k2) => NAME[k2]);
  $('stage').setAttribute('aria-label', 'Işıktan bir baş. ' + (lit.length ? 'Yanan bölgeler: ' + lit.join(', ') + '.' : 'Bütün bölgeler sakin; başlangıç ölçüldü.') + ` Gözler 20 saniyede ${D.blinks} kez kırpıyor.`);
  select(sel, true);
  if (GL) GL.onState();
}
function select(k, silent){
  sel = k; const D = DAYS[KEY[stKey]];
  chipsEl.classList.toggle('focus', !!k);
  chipsEl.querySelectorAll('.chip').forEach((c) => c.setAttribute('aria-pressed', c.dataset.k === k));
  const det = $('detail');
  if (k) { $('detailIn').innerHTML = D.a[k].d; det.classList.add('open'); }
  else det.classList.remove('open');
  if (GL && !silent) GL.onState();
}

/* ================= SDF: baş ================= */
const L3 = (x, y, z) => Math.sqrt(x * x + y * y + z * z);
function el(x, y, z, a, b, c){ const k0 = L3(x / a, y / b, z / c), k1 = L3(x / (a * a), y / (b * b), z / (c * c)); return k1 < 1e-9 ? -Math.min(a, b, c) : k0 * (k0 - 1) / k1; }
function smin(a, b, k){ const h = Math.max(k - Math.abs(a - b), 0) / k; return Math.min(a, b) - h * h * k * 0.25; }
function smax(a, b, k){ const h = Math.max(k - Math.abs(a - b), 0) / k; return Math.max(a, b) + h * h * k * 0.25; }
function cone(x, y, z, ax, ay, az, bx, by, bz, ra, rb){
  const px = x - ax, py = y - ay, pz = z - az, dx = bx - ax, dy = by - ay, dz = bz - az;
  const t = Math.max(0, Math.min(1, (px * dx + py * dy + pz * dz) / (dx * dx + dy * dy + dz * dz)));
  return L3(px - dx * t, py - dy * t, pz - dz * t) - (ra + (rb - ra) * t);
}
const EYE = { x: 0.305, y: 0.0, z: 0.64, r: 0.12 };
function ear(ax, y, z){
  const px = ax - 0.672, py = y + 0.16, pz = z + 0.16;
  const c = 0.96, s = 0.28; const qy = c * py - s * pz, qz = s * py + c * pz;
  let d = el(px - 0.018, qy, qz, 0.04, 0.24, 0.14);
  d = smax(d, -el(px - 0.056, qy + 0.02, qz + 0.012, 0.044, 0.15, 0.082), 0.025);
  return d;
}
/* burun sırtı: A (kök) → B (uç üstü) doğrusu boyunca, yanları ~30° açıyla geriye inen yuvarlatılmış kama */
const NA = [0.12, 0.83], NB = [-0.3, 1.085];
const NDY = NB[0] - NA[0], NDZ = NB[1] - NA[1], NLEN = Math.hypot(NDY, NDZ), NUY = NDY / NLEN, NUZ = NDZ / NLEN;
const NFY = NUZ, NFZ = -NUY; // öne bakan dik
function noseWedge(x, y, z){
  const along = (y - NA[0]) * NUY + (z - NA[1]) * NUZ;
  const t = Math.max(0, Math.min(NLEN, along));
  const ry = NA[0] + NUY * t, rz = NA[1] + NUZ * t;
  const qf = (y - ry) * NFY + (z - rz) * NFZ + 0.012 + 0.02 * (t / NLEN);
  const u = t / NLEN;
  let w = smax(x * 0.87 + qf * 0.5, -x * 0.87 + qf * 0.5, 0.04 + 0.025 * u);
  w = smax(w, -qf - (0.1 + 0.08 * u), 0.05);   // kama derinliği sınırlı: burun yüzden bir sırt olarak çıkar, yanağı doldurmaz
  return smax(smax(w, -along - 0.02, 0.12), along - NLEN - 0.01, 0.05);
}
function sdHead(x, y, z){
  const ax = Math.abs(x);
  let d = el(x, y - 0.3, z + 0.1, 0.68, 0.76, 0.9);                         // kafatası
  d = smin(d, el(x, y - 0.2, z + 0.45, 0.58, 0.58, 0.56), 0.3);             // ense çıkıntısı
  d = smin(d, el(x, y - 0.34, z - 0.28, 0.56, 0.56, 0.54), 0.22);           // alın
  d = smin(d, el(x, y + 0.08, z - 0.28, 0.57, 0.3, 0.46), 0.22);             // elmacık hattı
  d = smin(d, el(x, y + 0.42, z - 0.38, 0.42, 0.33, 0.52), 0.22);           // üst çene
  d = smin(d, el(x, y + 0.74, z + 0.02, 0.54, 0.52, 0.62), 0.26);           // alt/boyun başı
  d = smin(d, el(ax - 0.44, y + 0.1, z - 0.47, 0.18, 0.1, 0.19), 0.16);     // elmacık
  d = smax(d, -el(ax - 0.72, y - 0.25, z - 0.38, 0.1, 0.17, 0.16), 0.14);   // şakak
  d = smin(d, el(ax - 0.27, y - 0.16, z - 0.725, 0.23, 0.06, 0.1), 0.16);   // kaş kemeri
  d = smax(d, -el(ax - EYE.x, y - 0.012, z - 0.875, 0.19, 0.12, 0.2), 0.1); // göz çukuru
  d = smin(d, L3(ax - EYE.x, y - EYE.y, z - EYE.z) - EYE.r, 0.02);          // göz küresi
  let n = noseWedge(x, y, z);                                               // burun: sırttan tabana genişleyen kama
  n = smin(n, L3(x, y + 0.335, z - 1.045) - 0.058, 0.06);                   // burun ucu
  n = smin(n, el(ax - 0.074, y + 0.395, z - 0.945, 0.05, 0.045, 0.06), 0.06); // kanatlar
  d = smin(d, n, 0.05);
  d = smin(d, ear(ax, y, z), 0.045);
  return d;
}

const sm = (a, b, x) => { const t = Math.max(0, Math.min(1, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
/* saç bölgesi: alında saç çizgisi, şakaktan kulak üstüne, enseye iner */
function hairLine(x, z){
  const ax = Math.abs(x);
  const front = 0.66 - 0.28 * Math.pow(Math.min(1, ax / 0.6), 2);
  const side = 0.2;
  const back = side + (-0.14 - side) * sm(-0.32, -0.8, z);
  return z < -0.32 ? back : side + (front - side) * sm(0.16, 0.46, z);
}
function hairAmt(x, y, z){
  const yl = hairLine(x, z);
  let m = sm(yl - 0.01, yl + 0.1, y);
  if (Math.abs(x) > 0.5 && z > -0.42 && z < 0.22) m *= sm(0.2, 0.32, y); // kulak çevresi açık
  return m;
}

function cutAt(z){ const t = sm(-0.1, 0.75, z); return -0.74 + (-0.52 + 0.74) * t; }

/* göz yuvası çerçevesi (baş koordinatı) */
function eyeFrame(side){ // side: -1 yakın(kamera tarafı), +1 uzak
  const E = [side * EYE.x, EYE.y, EYE.z + EYE.r];
  let f = [side * 0.13, 0.02, 1]; const fl = L3(...f); f = f.map((v) => v / fl);
  // ex: göz köşesinden dışa (baş x yönünde, işaretli)
  let ex = [f[2], 0, -f[0]]; const el2 = L3(...ex); ex = ex.map((v) => v / el2);
  const ey = [f[1] * ex[2] - f[2] * ex[1], f[2] * ex[0] - f[0] * ex[2], f[0] * ex[1] - f[1] * ex[0]];
  return { E, f, ex, ey };
}
const LID_W = 0.128;
function lidU(lx){ const u = Math.max(-1, Math.min(1, lx / LID_W)); const sk = u + 0.22 * (1 - u * u); return 0.043 * Math.pow(Math.max(0, 1 - sk * sk), 0.7) + 0.01 * u; }
function lidL(lx){ const u = Math.max(-1, Math.min(1, lx / LID_W)); const sk = u - 0.12 * (1 - u * u); return -0.034 * Math.pow(Math.max(0, 1 - sk * sk), 0.9) + 0.01 * u; }

/* ================= GL ================= */
let GL = null;
function initGL(){
  if (!window.THREE) throw new Error('three yok');
  const T = THREE;
  const cv = $('cv'), stage = $('stage');
  const renderer = new T.WebGLRenderer({ canvas: cv, antialias: false, alpha: false, powerPreference: 'high-performance' });
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  renderer.setPixelRatio(dpr);
  const scene = new T.Scene();
  const cam = new T.PerspectiveCamera(16, 1, 1, 30);
  const head = new T.Group(); scene.add(head);

  let seed = 7;

  applyTheme(); resize(); computeTargets();
  for (let i = 0; i < 5; i++){ cur.int[i] = tgt.int[i]; cur.halo[i] = tgt.halo[i]; cur.lit[i] = tgt.lit[i]; } cur.walk = tgt.walk;
  if (reduce){ time = 1.35; for (let i = 0; i < 5; i++){ cur.int[i] = tgt.int[i]; cur.halo[i] = tgt.halo[i]; cur.lit[i] = tgt.lit[i]; } cur.walk = tgt.walk; draw(); }
  else requestAnimationFrame(loop);
}

setState(readHash());

/* ================= kaynaklar =================
   Yazı tipleri Google Fonts'tan, three.js cdnjs'ten gelir. İndirmeyi küçük bir Worker yapar:
   bağlantı koparsa sessizce yeniden dener (1,5 sn'de yanıt yoksa ikinci bir istekle yarıştırır).
   Sayfanın "load" olayı, baş ilk kez çizilene kadar gizli bir iframe ile bekletilir (en çok 26 sn);
   böylece önizleme ve ekran görüntüsü hiçbir zaman boş bir sahne yakalamaz.
   Worker ya da blob betiği açılamazsa (sıkı CSP) olağan <script>/<link> yoluna düşülür. */
const THREE_URL = 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';
/* Yazı tipi yalnız sayfada geçen harflerle istenir (Google Fonts "text" alt kümesi): aile başına tek küçük dosya. */
const GLYPHS = (() => {
  const all = [document.body.textContent, JSON.stringify(DAYS), JSON.stringify(NAME), JSON.stringify(WORD), '0123456789'].join('').replace(/<[^>]+>/g, '');
  return [...new Set(all.replace(/\s+/g, ' '))].sort().join('');
})();
const FONT_CSS = 'https://fonts.googleapis.com/css2?family=Onest:wght@400..600&family=Unbounded:wght@600&display=swap&text=' + encodeURIComponent(GLYPHS);
const release = (() => {
  try {
    const f = document.createElement('iframe'); f.hidden = true; f.tabIndex = -1; f.title = 'yükleme'; f.setAttribute('aria-hidden', 'true');
    document.body.appendChild(f);
    const d = f.contentDocument; d.open();
    let done = false;
    const go = () => { if (done) return; done = true; f.onload = () => f.remove(); try { d.close(); } catch (e) { f.remove(); } };
    setTimeout(go, 26000);
    return go;
  } catch (e) { return () => {}; }
})();
let threeDone = false, fontsDone = false;
function settle(){ if (threeDone && fontsDone) requestAnimationFrame(() => requestAnimationFrame(release)); }
function boot(){
  if (GL) return;
  try { initGL(); GL.onState(); } catch (e) { document.getElementById('app').classList.add('nogl'); GL = null; }
  threeDone = true; settle();
}
function plainThree(){
  if (window.THREE) return boot();
  const s = document.createElement('script'); s.src = THREE_URL;
  s.onload = boot; s.onerror = () => { document.getElementById('app').classList.add('nogl'); threeDone = true; settle(); };
  document.head.appendChild(s);
}
function plainFonts(){
  const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = FONT_CSS;
  l.onload = l.onerror = () => { fontsDone = true; settle(); };
  document.head.appendChild(l);
}
function worker(){
  // kademeli yedek istek: yanıt gecikirse 1,2 / 3 / 5,5 / 9 / 13 sn'de yeni bir istek açılır, ilk tamamlanan
  // kazanır. (Hızlı ağda ilk istek 1,2 sn dolmadan biter; yedekler hiç açılmaz.)
  const get = (u, as) => new Promise((resolve, reject) => {
    const at = [0, 1200, 3000, 5500, 9000, 13000];
    let live = 0, done = false, next = 0;
    const fire = () => {
      if (done || next >= at.length) return;
      next++; live++;
      fetch(u, { credentials: 'omit' }).then((r) => { if (!r.ok) throw new Error(r.status); return r[as](); })
        .then((v) => { if (!done) { done = true; resolve(v); } })
        .catch(() => { live--; if (!done && live === 0) { if (next < at.length) fire(); else reject(new Error('ulaşılamadı: ' + u)); } });
    };
    at.forEach((t) => setTimeout(fire, t));
  });
  self.onmessage = async (e) => {
    const { three, css } = e.data;
    get(three, 'text').then((txt) => postMessage({ t: 'three', txt }), () => postMessage({ t: 'three', txt: null }));
    try {
      const text = await get(css, 'text');
      const faces = text.split('@font-face').slice(1).map((f) => ({
        fam: (/font-family:\s*'([^']+)'/.exec(f) || [])[1], w: (/font-weight:\s*([\d ]+);/.exec(f) || [])[1],
        src: (/url\((https:[^)]+)\)/.exec(f) || [])[1], ur: (/unicode-range:\s*([^;]+);/.exec(f) || [])[1],
      })).filter((f) => f.fam && f.src && f.ur);
      await Promise.all(faces.map((f) => get(f.src, 'arrayBuffer').then((buf) => postMessage({ t: 'font', fam: f.fam, w: f.w, ur: f.ur, buf }, [buf]))));
      postMessage({ t: 'fonts', ok: true });
    } catch (err) { postMessage({ t: 'fonts', ok: false }); }
  };
}
(function load(){
  let w;
  try { w = new Worker(URL.createObjectURL(new Blob(['(' + worker.toString() + ')()'], { type: 'text/javascript' }))); }
  catch (e) { plainThree(); plainFonts(); return; }
  const faces = [];
  w.onerror = () => { w.terminate(); if (!threeDone) plainThree(); if (!fontsDone) plainFonts(); };
  w.onmessage = (e) => {
    const m = e.data;
    if (m.t === 'three'){
      if (!m.txt) return plainThree();
      const s = document.createElement('script');
      s.src = URL.createObjectURL(new Blob([m.txt], { type: 'text/javascript' }));
      s.onload = () => { URL.revokeObjectURL(s.src); boot(); };
      s.onerror = plainThree;
      document.head.appendChild(s);
    } else if (m.t === 'font'){
      try { const ff = new FontFace(m.fam, m.buf, { weight: m.w.trim(), unicodeRange: m.ur, display: 'swap' }); document.fonts.add(ff); faces.push(ff.load()); } catch (err) {}
    } else if (m.t === 'fonts'){
      if (!m.ok) plainFonts();
      else Promise.allSettled(faces).then(() => { fontsDone = true; settle(); });
    }
  };
  w.postMessage({ three: THREE_URL, css: FONT_CSS });
})();
})();
</script>
