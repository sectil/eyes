:root{
  --bg:#f3f6f8; --surface:#fff; --ink:#0b1219; --ink-2:#33414d; --iris-1:#11a9b8; --iris-2:#2f6bea; --lens:#f08a00; --ok:#13704b;
  --line:rgba(11,18,25,.09); --chip:#fff; --chip-on:#fff; --muted:#6a7884;
  --stage-a:#e9eff3; --stage-b:#f3f6f8;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#070c12; --surface:#0f171f; --ink:#eef3f6; --ink-2:#b9c4cd; --iris-1:#19c2d1; --iris-2:#3e7bfa; --lens:#ffb13b; --ok:#35d39a;
    --line:rgba(238,243,246,.08); --chip:#0f171f; --chip-on:#132029; --muted:#8a98a4;
    --stage-a:#0c141c; --stage-b:#070c12;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#070c12; --surface:#0f171f; --ink:#eef3f6; --ink-2:#b9c4cd; --iris-1:#19c2d1; --iris-2:#3e7bfa; --lens:#ffb13b; --ok:#35d39a;
  --line:rgba(238,243,246,.08); --chip:#0f171f; --chip-on:#132029; --muted:#8a98a4;
  --stage-a:#0c141c; --stage-b:#070c12;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{color:var(--ink);font:400 15px/1.45 'Onest',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
.app{max-width:390px;margin:0 auto;padding:10px 16px 28px;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.seg{display:flex;gap:2px;padding:3px;border-radius:12px;background:var(--surface);border:1px solid var(--line);align-self:stretch}
.seg button{flex:1;appearance:none;border:0;background:transparent;color:var(--ink-2);font:500 12.5px/1 'Onest',system-ui,sans-serif;padding:8px 4px;border-radius:9px;cursor:pointer;transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg button:focus-visible{outline:2px solid var(--iris-1);outline-offset:1px}
header{display:flex;align-items:baseline;justify-content:space-between;margin:14px 2px 0}
h1{font:600 24px/1.1 'Unbounded','Onest',system-ui,sans-serif;letter-spacing:-.01em}
.day{font:500 13px/1 'Onest',system-ui,sans-serif;color:var(--ink-2);display:flex;align-items:center;gap:7px}
.day i{width:7px;height:7px;border-radius:50%;background:var(--iris-1);display:inline-block}
.day.live i{background:var(--lens);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35;transform:scale(.8)}}
.stage{position:relative;margin:4px -16px 0;height:clamp(236px,min(50vh,94vw),430px)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}
.nef{margin:4px 2px 0;font:400 15.5px/1.45 'Onest',system-ui,sans-serif;color:var(--ink);min-height:2.9em;text-wrap:pretty}
.nef .who{font-weight:600;color:var(--ink-2);margin-right:4px}
.nef .live{color:var(--lens);font-weight:600}
.chips{list-style:none;margin:14px 0 0;display:flex;flex-direction:column;gap:6px}
.chip{border-radius:14px;background:var(--chip);border:1px solid var(--line);overflow:hidden;transition:border-color .25s,background .25s}
.chip button{appearance:none;border:0;background:transparent;color:inherit;font:inherit;width:100%;text-align:left;display:grid;grid-template-columns:14px 1fr auto;align-items:center;column-gap:10px;padding:11px 12px;cursor:pointer}
.chip button:focus-visible{outline:2px solid var(--iris-1);outline-offset:-2px;border-radius:14px}
.dot{width:10px;height:10px;border-radius:50%;justify-self:center;border:1.5px solid var(--muted);opacity:.8}
.chip[data-st="up"] .dot{border:0;background:radial-gradient(circle at 40% 40%,#fff 0 18%,var(--iris-1) 45%,var(--iris-2) 100%);box-shadow:0 0 10px color-mix(in srgb,var(--iris-1) 70%,transparent);opacity:1}
.chip[data-st="live"] .dot{border:0;background:var(--lens);box-shadow:0 0 10px var(--lens);opacity:1;animation:pulse 1.2s ease-in-out infinite}
.nm{font:600 14.5px/1.2 'Onest',system-ui,sans-serif;display:block}
.vl{font:400 12.5px/1.3 'Onest',system-ui,sans-serif;color:var(--ink-2);display:block;margin-top:2px;font-variant-numeric:tabular-nums}
.st{font:500 11.5px/1.2 'Onest',system-ui,sans-serif;color:var(--muted);text-align:right;max-width:9.5em}
.chip[data-st="up"] .st{color:var(--iris-1)}
.chip[data-st="live"] .st{color:var(--lens)}
.chip[aria-current="true"]{background:var(--chip-on);border-color:color-mix(in srgb,var(--ink) 22%,transparent)}
.dt{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
.dt>div{overflow:hidden}
.dt p{padding:0 14px 13px 36px;font:400 13.5px/1.5 'Onest',system-ui,sans-serif;color:var(--ink-2)}
.dt b{color:var(--ink);font-weight:600}
.chip[aria-current="true"] .dt{grid-template-rows:1fr}
.foot{margin-top:14px;font:400 11.5px/1.4 'Onest',system-ui,sans-serif;color:var(--muted);padding:0 2px}
@media (max-height:600px){.stage{height:clamp(236px,min(46vh,90vw),300px)}.nef{font-size:14.5px}header{margin-top:10px}h1{font-size:21px}}
@media (prefers-reduced-motion:reduce){.day.live i,.chip[data-st="live"] .dot{animation:none}.dt{transition:none}}

const PL = new Float32Array(NV), PF = new Float32Array(NV)
let FB = new Float32Array(1)
const PX = new Float32Array(NV), PY = new Float32Array(NV), PZ = new Float32Array(NV), FV = new Float32Array(NV)
const PIV = [0, 3.0, -7.6]
let R = [1, 0, 0, 0, 1, 0, 0, 0, 1], BS = 1, CAM = [0, 0, 0]
const F = 95
let theme = null

function readTheme() {
  const cs = getComputedStyle(document.documentElement)
  const v = (n) => cs.getPropertyValue(n).trim()
  const dark = cs.getPropertyValue('color-scheme').trim() === 'dark'
  theme = { dark, bg: v('--bg'), ink: v('--ink'), ink2: v('--ink-2'), i1: v('--iris-1'), i2: v('--iris-2'), lens: v('--lens') }
}
function hexRgb(h) { h = h.replace('#', ''); if (h.length === 3) h = h.split('').map(c => c + c).join(''); const n = parseInt(h, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255] }
const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${Math.max(0, Math.min(1, a)).toFixed(3)})`

function matMul(a, b) {
  const o = new Array(9)
  for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) o[r * 3 + c] = a[r * 3] * b[c] + a[r * 3 + 1] * b[3 + c] + a[r * 3 + 2] * b[6 + c]
  return o
}
const Rx = (a) => { const c = Math.cos(a), s = Math.sin(a); return [1, 0, 0, 0, c, -s, 0, s, c] }
const Ry = (a) => { const c = Math.cos(a), s = Math.sin(a); return [c, 0, s, 0, 1, 0, -s, 0, c] }
const Rz = (a) => { const c = Math.cos(a), s = Math.sin(a); return [c, -s, 0, s, c, 0, 0, 0, 1] }

function setPose(yaw, pitch, roll, tilt, bs) {
  R = matMul(Rx(pitch), matMul(Rz(roll), matMul(Ry(yaw), Rx(-tilt))))
  BS = bs
  // kameranın baş-yerel konumu (bakış yönleri için)
  const cz = F / bs
  CAM = [PIV[0] + R[6] * cz, PIV[1] + R[7] * cz, PIV[2] + R[8] * cz]
}
// baş-yerel nokta -> ekran [x, y, derinlik]
function proj(x, y, z, out) {
  x -= PIV[0]; y -= PIV[1]; z -= PIV[2]
  const xv = (R[0] * x + R[1] * y + R[2] * z) * BS, yv = (R[3] * x + R[4] * y + R[5] * z) * BS, zv = (R[6] * x + R[7] * y + R[8] * z) * BS
  const p = F / (F - zv)
  out[0] = CX + S * xv * p; out[1] = CY - S * yv * p; out[2] = zv
  return out
}
function facing(px, py, pz, nx, ny, nz) {
  const vx = CAM[0] - px, vy = CAM[1] - py, vz = CAM[2] - pz, l = Math.sqrt(vx * vx + vy * vy + vz * vz)
  return (nx * vx + ny * vy + nz * vz) / l
}

// ---------- derinlik tamponu ----------
function rasterZ() {
  ZB.fill(-1e9); LB.fill(0); FB.fill(0)
  const inv = 1 / ZS
  for (let j = 0; j < NP; j++) for (let i = 0; i < NT; i++) {
    const a = j * NT + i, b = j * NT + (i + 1) % NT, c = (j + 1) * NT + (i + 1) % NT, d = (j + 1) * NT + i
    if (FV[a] < -0.05 && FV[b] < -0.05 && FV[c] < -0.05 && FV[d] < -0.05) continue
    tri(a, b, c, inv); tri(a, c, d, inv)
  }
}
function tri(a, b, c, inv) {
  const x0 = PX[a] * inv, y0 = PY[a] * inv, x1 = PX[b] * inv, y1 = PY[b] * inv, x2 = PX[c] * inv, y2 = PY[c] * inv
  const area = (x1 - x0) * (y2 - y0) - (x2 - x0) * (y1 - y0)
  if (Math.abs(area) < 1e-6) return
  let minx = Math.max(0, Math.floor(Math.min(x0, x1, x2))), maxx = Math.min(ZW - 1, Math.ceil(Math.max(x0, x1, x2)))
  let miny = Math.max(0, Math.floor(Math.min(y0, y1, y2))), maxy = Math.min(ZH - 1, Math.ceil(Math.max(y0, y1, y2)))
  const z0 = PZ[a], z1 = PZ[b], z2 = PZ[c], ia = 1 / area, l0 = PL[a], l1 = PL[b], l2 = PL[c], f0 = PF[a], f1 = PF[b], f2 = PF[c]
  for (let y = miny; y <= maxy; y++) {
    const py = y + 0.5
    for (let x = minx; x <= maxx; x++) {
      const px = x + 0.5
      let w0 = ((x1 - px) * (y2 - py) - (x2 - px) * (y1 - py)) * ia
      let w1 = ((x2 - px) * (y0 - py) - (x0 - px) * (y2 - py)) * ia
      let w2 = 1 - w0 - w1
      if (w0 < -0.02 || w1 < -0.02 || w2 < -0.02) continue
      const z = w0 * z0 + w1 * z1 + w2 * z2, k = y * ZW + x
      if (z > ZB[k]) { ZB[k] = z; LB[k] = w0 * l0 + w1 * l1 + w2 * l2; FB[k] = w0 * f0 + w1 * f1 + w2 * f2 }
    }
  }
}
function zAt(sx, sy) {
  const x = Math.floor(sx / ZS), y = Math.floor(sy / ZS)
  if (x < 0 || y < 0 || x >= ZW || y >= ZH) return -1e9
  return ZB[y * ZW + x]
}
function visible(sx, sy, z, bias) {
  // küçük komşulukta en uzak yüzey: kenar titremesini azaltır
  let m = 1e9
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) { if (dx && dy) continue; m = Math.min(m, zAt(sx + dx * ZS * 0.6, sy + dy * ZS * 0.6)) }
  return z >= m - bias ? 1 : smoothstep(bias * 2.2, bias, m - z)
}

// ---------- değişken kalınlıklı ışık şeridi ----------
const RX = new Float32Array(512), RY = new Float32Array(512), RW = new Float32Array(512), RA = new Float32Array(512)
function ribbon(c, n, color, alphaMul) {
  if (n < 2) return
  // normal vektörler
  const NXa = ribbon.nx || (ribbon.nx = new Float32Array(512)), NYa = ribbon.ny || (ribbon.ny = new Float32Array(512))
  for (let k = 0; k < n; k++) {
    const k0 = Math.max(0, k - 1), k1 = Math.min(n - 1, k + 1)
    let tx = RX[k1] - RX[k0], ty = RY[k1] - RY[k0]
    const l = Math.hypot(tx, ty) || 1
    NXa[k] = -ty / l; NYa[k] = tx / l
  }
  let k = 0
  while (k < n - 1) {
    const q = Math.round(((RA[k] + RA[k + 1]) * 0.5) * 20) / 20
    let e = k + 1
    while (e < n - 1 && Math.round(((RA[e] + RA[e + 1]) * 0.5) * 20) / 20 === q && e - k < 60) e++
    if (q > 0.01) {
      c.globalAlpha = Math.min(1, q * alphaMul)
      c.fillStyle = color
      c.beginPath()
      for (let i = k; i <= e; i++) { const h = RW[i] * 0.5; if (i === k) c.moveTo(RX[i] + NXa[i] * h, RY[i] + NYa[i] * h); else c.lineTo(RX[i] + NXa[i] * h, RY[i] + NYa[i] * h) }
      for (let i = e; i >= k; i--) { const h = RW[i] * 0.5; c.lineTo(RX[i] - NXa[i] * h, RY[i] - NYa[i] * h) }
      c.closePath(); c.fill()
    }
    k = e
  }
  c.globalAlpha = 1
}

// ---------- kontur (siluet) çıkarımı ----------
const EDGE = new Int32Array(NT * (NP + 1) * 2)
function contours() {
  const segs = []
  const H0 = 0, V0 = NT * (NP + 1)
  const cross = new Map()
  const pt = (a, b) => {
    const key = a < b ? a * 131071 + b : b * 131071 + a
    let q = cross.get(key)
    if (q) return q
    const fa = FV[a], fb = FV[b], t = fa / (fa - fb)
    q = { key, x: lerp(PX[a], PX[b], t), y: lerp(PY[a], PY[b], t), z: lerp(PZ[a], PZ[b], t),
      lx: lerp(MV[a * 3], MV[b * 3], t), ly: lerp(MV[a * 3 + 1], MV[b * 3 + 1], t), lz: lerp(MV[a * 3 + 2], MV[b * 3 + 2], t),
      nx: lerp(MN[a * 3], MN[b * 3], t), ny: lerp(MN[a * 3 + 1], MN[b * 3 + 1], t), nz: lerp(MN[a * 3 + 2], MN[b * 3 + 2], t), w: lerp(MW[a], MW[b], t), link: [] }
    cross.set(key, q)
    return q
  }
  for (let j = 0; j < NP; j++) for (let i = 0; i < NT; i++) {
    const a = j * NT + i, b = j * NT + (i + 1) % NT, c = (j + 1) * NT + (i + 1) % NT, d = (j + 1) * NT + i
    const sa = FV[a] > 0, sb = FV[b] > 0, sc = FV[c] > 0, sd = FV[d] > 0
    const e = []
    if (sa !== sb) e.push([a, b]); if (sb !== sc) e.push([b, c]); if (sc !== sd) e.push([c, d]); if (sd !== sa) e.push([d, a])
    if (e.length === 2) { const p = pt(...e[0]), q = pt(...e[1]); p.link.push(q); q.link.push(p) }
    else if (e.length === 4) {
      const ctr = (FV[a] + FV[b] + FV[c] + FV[d]) > 0
      const p0 = pt(...e[0]), p1 = pt(...e[1]), p2 = pt(...e[2]), p3 = pt(...e[3])
      if (ctr === sa) { p0.link.push(p1); p1.link.push(p0); p2.link.push(p3); p3.link.push(p2) } else { p0.link.push(p3); p3.link.push(p0); p1.link.push(p2); p2.link.push(p1) }
    }
  }
  // zincirle
  const seen = new Set(), loops = []
  for (const q of cross.values()) {
    if (seen.has(q) || q.link.length === 0) continue
    // uç noktadan başla (açık zincirse)
    let s = q, prev = null, guard = 0
    while (s.link.length === 2 && guard++ < 20000) { const nx = s.link[0] === prev ? s.link[1] : s.link[0]; prev = s; s = nx; if (s === q) break }
    const chain = []; prev = null; let cur = s; guard = 0
    while (cur && !seen.has(cur) && guard++ < 20000) {
      seen.add(cur); chain.push(cur)
      const nx = cur.link[0] !== prev && !seen.has(cur.link[0]) ? cur.link[0] : (cur.link[1] && !seen.has(cur.link[1]) ? cur.link[1] : null)
      prev = cur; cur = nx
    }
    const closed = chain.length > 2 && chain[chain.length - 1].link.includes(chain[0])
    if (chain.length > 3) loops.push({ pts: chain, closed })
  }
  return loops
}

// ---------- başlangıç ----------
let ready = false
function init() {
  buildMesh(); buildLines(); buildBand()
  ready = true
}

// ---------- boyutlandırma ----------
function resize() {
  const r = cv.getBoundingClientRect()
  DPR = Math.min(2, window.devicePixelRatio || 1)
  W = Math.max(10, r.width); H = Math.max(10, r.height)
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR)
  glowC.width = Math.max(1, Math.round(W * DPR / 4)); glowC.height = Math.max(1, Math.round(H * DPR / 4))
  glow2.width = Math.max(1, Math.round(W * DPR / 10)); glow2.height = Math.max(1, Math.round(H * DPR / 10))
  ZS = 2.4
  ZW = Math.ceil(W / ZS); ZH = Math.ceil(H / ZS); ZB = new Float32Array(ZW * ZH); LB = new Float32Array(ZW * ZH); FB = new Float32Array(ZW * ZH)
  shadeC.width = ZW; shadeC.height = ZH; shadeImg = sctx.createImageData(ZW, ZH)
  fit()
}
function fit() {
  // taban pozda görünen bölgenin (burun ucundan yukarısı) sınırları
  setPose(BASE.yaw, BASE.pitch, BASE.roll, BASE.tilt, 1)
  S = 1; CX = 0; CY = 0
  let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9
  const o = [0, 0, 0]
  for (let k = 0; k < NV; k++) {
    if (MV[k * 3 + 1] < -3.9) continue
    proj(MV[k * 3], MV[k * 3 + 1], MV[k * 3 + 2], o)
    x0 = Math.min(x0, o[0]); x1 = Math.max(x1, o[0]); y0 = Math.min(y0, o[1]); y1 = Math.max(y1, o[1])
  }
  const mx = Math.max(14, W * 0.04), myT = Math.max(10, H * 0.03), myB = Math.max(4, H * 0.01)
  S = Math.min((W - 2 * mx) / (x1 - x0), (H - myT - myB) / (y1 - y0))
  CX = W / 2 - S * (x0 + x1) / 2 + W * 0.01
  CY = myT - S * y0 + ((H - myT - myB) - S * (y1 - y0)) / 2
  if (QS.has('zoom')) {
    const z = +QS.get('zoom'), f = [0, 0, 0]
    proj(0, -0.8, 0, f)
    S *= z; CX = W / 2 - (f[0] - CX) * z; CY = H / 2 - (f[1] - CY) * z
  }
}

// ---------- canlılık ----------
const BASE = { yaw: (+QS.get('yaw') || 27) * DEG, pitch: (QS.has('pitch') ? +QS.get('pitch') : 1.5) * DEG, roll: -2 * DEG, tilt: (QS.has('tilt') ? +QS.get('tilt') : 6) * DEG }
let stKey = '30', focus = null, t0 = performance.now(), lastT = 0
let blinkAt = 4.2, blinkIdx = 0, REV = 1
// açılışta ışığın başın arkasından yüze doğru süpürmesi
function sweep(x, y) { if (REV >= 1) return 1; const u = (x / W) * 0.55 + (y / H) * 0.45; return smoothstep(u - 0.02, u + 0.2, REV * 1.25) }
let gazeCur = [0, 0], gazeTo = [0, 0], nextSacc = 1.6
function blinkAmount(t) {
  const per = 20 / DAYS[stKey].blinks
  while (t > blinkAt + 0.5) { blinkIdx++; blinkAt += per + (blinkIdx % 2 ? 0.35 : -0.35) * (per > 3 ? 1 : 0) }
  const u = t - blinkAt
  if (u < 0) return 0
  if (u < 0.085) { const s = u / 0.085; return s * s }
  if (u < 0.12) return 1
  if (u < 0.3) { const s = (u - 0.12) / 0.18; return 1 - s * s * (3 - 2 * s) }
  return 0
}
function rnd(i) { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x) }

// ---------- çizim ----------
const tmp = [0, 0, 0], tmp2 = [0, 0, 0]
function frame(now) {
  if (!ready) return
  const t = RM ? 2.2 : Math.max(0, (now - t0) / 1000)
  const dark = theme.dark
  const breath = Math.sin(t * TAU / 5.6)
  const walk = stKey === 'walk'
  const yaw = BASE.yaw + (RM ? 0 : 2.2 * DEG * Math.sin(t * TAU / 19) + 0.8 * DEG * Math.sin(t * TAU / 7.3))
  const pitch = BASE.pitch + (RM ? 0 : 1.1 * DEG * Math.sin(t * TAU / 13 + 1) + (walk ? 0.45 * DEG * Math.sin(t * TAU * 1.0) : 0))
  const roll = BASE.roll + (RM ? 0 : 0.9 * DEG * Math.sin(t * TAU / 11 + 2))
  setPose(yaw, pitch, roll, BASE.tilt + (RM ? 0 : 0.5 * DEG * breath), 1 + (RM ? 0 : 0.007 * breath))

  // ağ projeksiyonu
  for (let k = 0; k < NV; k++) {
    const x = MV[k * 3], y = MV[k * 3 + 1], z = MV[k * 3 + 2]
    proj(x, y, z, tmp)
    PX[k] = tmp[0]; PY[k] = tmp[1]; PZ[k] = tmp[2]
    FV[k] = facing(x, y, z, MN[k * 3], MN[k * 3 + 1], MN[k * 3 + 2])
    // ışık: yukarı-sağ-önden anahtar ışık + arkadan kenar ışığı
    const nx = MN[k * 3], ny = MN[k * 3 + 1], nz = MN[k * 3 + 2]
    const vx = R[0] * nx + R[1] * ny + R[2] * nz, vy = R[3] * nx + R[4] * ny + R[5] * nz, vz = R[6] * nx + R[7] * ny + R[8] * nz
    const key = Math.max(0, vx * 0.42 + vy * 0.5 + vz * 0.76)
    const fres = Math.pow(1 - Math.max(0, vz), 3) * Math.max(0, -vx * 0.62 + vy * 0.78 + 0.25)
    const fy = smoothstep(lerp(-4.2, -2.6, smoothstep(-8, -14, z)), lerp(-1.6, 0.8, smoothstep(-8, -14, z)), y)
    PL[k] = (0.55 * key * key * key + 0.85 * fres) * fy
    PF[k] = fy * smoothstep(0, 0.5, vz)
  }
  rasterZ()

  const dt = Math.max(0, Math.min(0.25, t - lastT)); lastT = t
  easeLobes(t, dt)
  REV = RM ? 1 : smoothstep(0.0, 1.35, t)
  const c = ctx
  c.setTransform(DPR, 0, 0, DPR, 0, 0)
  c.clearRect(0, 0, W, H)
  const ink = hexRgb(dark ? '#e3f1f8' : theme.ink)
  const i1 = hexRgb(theme.i1), i2 = hexRgb(theme.i2), lens = hexRgb(theme.lens)

  // ---- arka plan: başın arkasında çok hafif bir ışık ----
  {
    const o = [0, 0, 0]; proj(0, 3.2, -7.5, o)
    const rr = Math.min(o[0], W - o[0], o[1] + H * 0.08, H - o[1]) * 0.98
    const g = c.createRadialGradient(o[0], o[1], 0, o[0], o[1], rr)
    if (dark) { g.addColorStop(0, 'rgba(62,123,250,0.10)'); g.addColorStop(0.5, 'rgba(40,150,230,0.045)'); g.addColorStop(1, 'rgba(25,194,209,0)') }
    else { g.addColorStop(0, 'rgba(47,107,234,0.06)'); g.addColorStop(0.5, 'rgba(47,107,234,0.025)'); g.addColorStop(1, 'rgba(47,107,234,0)') }
    c.fillStyle = g; c.beginPath(); c.arc(o[0], o[1], rr, 0, TAU); c.fill()
  }
  // ---- ışıktan hacim: yüzeyin ışığı yumuşak bir örtü olarak ----
  {
    const d = shadeImg.data, col = dark ? [150, 205, 235] : [84, 104, 124]
    const amax = dark ? 0.2 : 0.22
    for (let k = 0, n = ZW * ZH; k < n; k++) {
      const a = ZB[k] > -1e8 ? (dark ? Math.min(1, LB[k]) : Math.max(0, 0.62 - LB[k]) * FB[k]) * amax : 0
      d[k * 4] = col[0]; d[k * 4 + 1] = col[1]; d[k * 4 + 2] = col[2]; d[k * 4 + 3] = a * 255
    }
    sctx.putImageData(shadeImg, 0, 0)
    c.save(); c.imageSmoothingEnabled = true
    c.globalCompositeOperation = dark ? 'lighter' : 'multiply'
    if (!dark) { /* açık temada hacim: çok hafif mavi-gri gölge */ }
    c.globalAlpha = REV * REV
    c.drawImage(shadeC, 0, 0, ZW * ZS, ZH * ZS)
    c.restore()
  }
  // ---- loblar ----
  c.globalCompositeOperation = dark ? 'lighter' : 'multiply'
  const day = DAYS[stKey]
  if (!DBG) drawOptic(c, t, dark, i1)
  if (!DBG) for (const id of AREAS) drawLobe(c, id, day.a[id].st, t, breath, dark, i1, i2, lens)

  // ---- siluet ve iç konturlar ----
  c.globalCompositeOperation = dark ? 'lighter' : 'source-over'
  const loops = contours()
  const lineCol = rgba(ink, 1)
  let outerLen = 0, outer = null
  for (const L of loops) {
    let len = 0
    for (let k = 1; k < L.pts.length; k++) len += Math.hypot(L.pts[k].x - L.pts[k - 1].x, L.pts[k].y - L.pts[k - 1].y)
    L.len = len
    if (len > outerLen) { outerLen = len; outer = L }
  }
  const rimDir = [-0.62, -0.78]
  for (const L of loops) {
    if (L.len < 14) continue
    const pts = L.pts, n = Math.min(pts.length, 500)
    // her noktada: dış siluet mi, görünür mü?
    let m = 0, acc = 0
    for (let k = 0; k < n; k++) {
      const p = pts[k]
      const nvx = R[0] * p.nx + R[1] * p.ny + R[2] * p.nz, nvy = -(R[3] * p.nx + R[4] * p.ny + R[5] * p.nz)
      const nl = Math.hypot(nvx, nvy) || 1
      const ox = nvx / nl, oy = nvy / nl
      const outside = zAt(p.x + ox * ZS * 2.2, p.y + oy * ZS * 2.2) < -1e8
      const vis = visible(p.x, p.y, p.z, 0.55)
      const noseZone = smoothstep(1.9, 1.4, Math.abs(p.lx)) * smoothstep(-0.8, 0.2, p.lz)
      const fade = Math.max(noseZone * smoothstep(-4.3, -3.7, p.ly), smoothstep(lerp(-3.9, -3.2, smoothstep(-11, -15, p.lz)), lerp(-2.3, -0.6, smoothstep(-11, -15, p.lz)), p.ly))
      const rim = Math.pow(Math.max(0, ox * rimDir[0] + oy * rimDir[1]), 1.4)
      const fr = smoothstep(-3.2, -0.6, p.lz) // yüz bölgesi: ışık değil çizgi
      acc += k ? Math.hypot(p.x - pts[k - 1].x, p.y - pts[k - 1].y) : 0
      const lf = 0.62 + 0.38 * Math.sin(acc * 0.021 + 1.3) * Math.sin(acc * 0.0077 + 0.4)
      RX[m] = p.x; RY[m] = p.y
      const swp = sweep(p.x, p.y)
      if (outside) {
        RW[m] = lerp(0.55 + 2.0 * rim, 0.8 + 0.35 * lf, fr)
        RA[m] = swp * vis * fade * p.w * lerp((0.16 + 0.84 * rim) * lf, 0.5 + 0.28 * lf, fr)
      } else {
        RW[m] = 1.0
        RA[m] = swp * vis * fade * p.w * (p.lz > -3.5 ? 0.7 : 0.3)
      }

      radial(c, x, y, S * 0.55, col, (dark ? 0.55 : 0.5) * Math.sin(pu * Math.PI) * Math.min(1, fo) * (pi === 0 ? 1 : 0.6), 0.4)
    }
  })
}

// ---------- etiketler ----------
let LAB = 1
function drawLabels(c, t, dark) {
  LAB = RM ? 1 : smoothstep(1.2, 2.2, t)
  const day = DAYS[stKey]
  const o = [0, 0, 0]
  c.font = "600 10.5px Onest, system-ui, sans-serif"
  c.textBaseline = 'middle'
  for (const id of AREAS) {
    const st = day.a[id].st
    const lit = LS[id].on > 0.5
    let a = (lit ? 1 : 0.72) * Math.min(1, LS[id].f) * (focus ? (focus === id ? 1 : 1.35) : 1) * LAB
    a = Math.min(1, a)
    lobeCenter(id, o)
    const L = LOBES[id]
    let x = o[0], y = o[1]
    // düğüm noktası
    c.fillStyle = dark ? (st === 'live' && lit ? `rgba(255,236,205,${a})` : lit ? `rgba(235,253,255,${a})` : `rgba(170,186,200,${a * 0.8})`) : (lit ? (st === 'live' ? `rgba(160,80,0,${a})` : `rgba(8,90,110,${a})`) : `rgba(51,65,77,${a * 0.7})`)
    c.beginPath(); c.arc(x, y, lit ? 1.9 : 1.5, 0, TAU); c.fill()
    const txt = NAME[id]
    const tw = c.measureText(txt).width
    let lx, ly = y
    if (L.band) { lx = x - tw / 2; ly = y + 11 }
    else { const off = L.r * S * (lit ? 0.98 : 0.72) + 4; lx = L.side > 0 ? x + off : x - off - tw; if (lx + tw > W - 6) lx = x - off - tw; if (lx < 6) lx = x + off }
    c.textAlign = 'left'
    c.lineWidth = 3; c.lineJoin = 'round'
    c.strokeStyle = dark ? `rgba(7,12,18,${0.5 * a})` : `rgba(243,246,248,${0.75 * a})`
    c.strokeText(txt, lx, ly)
    c.fillStyle = dark ? (lit ? `rgba(240,252,255,${a})` : `rgba(185,196,205,${a * 0.85})`) : (lit ? `rgba(11,18,25,${a})` : `rgba(51,65,77,${a * 0.85})`)
    c.fillText(txt, lx, ly)
  }
}

// ---------- arayüz ----------
const chipsEl = document.getElementById('chips'), nefEl = document.getElementById('nef'), dayEl = document.getElementById('day')
function renderUI() {
  const day = DAYS[stKey]
  document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.k === stKey)))
  dayEl.querySelector('span').textContent = day.label
  dayEl.classList.toggle('live', stKey === 'walk')
  nefEl.innerHTML = '<span class="who">Nef</span>' + day.nef
  chipsEl.innerHTML = AREAS.map(id => {
    const a = day.a[id]
    return `<li class="chip" data-id="${id}" data-st="${a.st}" aria-current="${focus === id}"><button type="button" aria-expanded="${focus === id}"><span class="dot"></span><span><span class="nm">${NAME[id]}</span><span class="vl">${a.v}</span></span><span class="st">${WORD[a.st]}</span></button><div class="dt"><div><p>${a.d}</p></div></div></li>`
  }).join('')
}
chipsEl.addEventListener('click', (ev) => {
  const li = ev.target.closest('.chip'); if (!li) return
  setFocus(focus === li.dataset.id ? null : li.dataset.id)
})
function setFocus(id) {
  focus = id
  chipsEl.querySelectorAll('.chip').forEach(li => { const on = li.dataset.id === id; li.setAttribute('aria-current', String(on)); li.querySelector('button').setAttribute('aria-expanded', String(on)) })
  if (RM) frame(performance.now())
}
cv.addEventListener('click', (ev) => {
  const r = cv.getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top
  let best = null, bd = 1e9; const o = [0, 0, 0]
  for (const id of AREAS) { lobeCenter(id, o); const d = Math.hypot(o[0] - x, o[1] - y); if (d < bd) { bd = d; best = id } }
  if (bd < S * 3.2) setFocus(focus === best ? null : best)
})
document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => { history.replaceState(null, '', '#' + (b.dataset.k === '30' ? 'd30' : b.dataset.k === '1' ? 'd1' : 'walk')); fromHash() }))
function fromHash() {
  const h = (location.hash || '').replace('#', '')
  const k = h === 'walk' ? 'walk' : h === 'd1' ? '1' : '30'
  if (k !== stKey) { stKey = k; blinkAt = Math.max(4.2, ((performance.now() - t0) / 1000) + 1.4); blinkIdx = 0 }
  stKey = k
  renderUI()
  if (RM && ready) frame(performance.now())
}
window.addEventListener('hashchange', fromHash)

function loop(now) { frame(now); if (!RM) requestAnimationFrame(loop) }
function start() {
  readTheme(); init(); resize(); fromHash()
  if (RM) frame(performance.now()); else requestAnimationFrame(loop)
}
if (typeof matchMedia === 'function') matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { readTheme(); if (RM) frame(performance.now()) })
window.addEventListener('resize', () => { resize(); if (RM) frame(performance.now()) })
stKey = (location.hash === '#walk') ? 'walk' : (location.hash === '#d1') ? '1' : '30'
renderUI()
start()
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (RM) frame(performance.now()) })
</script>
