*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Onest,"SF Pro Text",-apple-system,system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
.app{max-width:390px;margin:0 auto;padding:10px 16px 28px;overflow:hidden}
.seg{display:flex;gap:2px;padding:3px;border-radius:12px;background:var(--seg);border:1px solid var(--line)}
.seg button{flex:1;appearance:none;border:0;background:transparent;color:var(--ink-3);font:500 13px/1 inherit;font-family:inherit;padding:8px 4px;border-radius:9px;cursor:pointer;transition:background .25s,color .25s}
.seg button[aria-pressed="true"]{background:var(--seg-on);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
header{display:flex;align-items:baseline;justify-content:space-between;margin:16px 2px 0}
h1{font-family:Unbounded,"SF Pro Display",-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;font-weight:600;font-size:25px;letter-spacing:-.01em;margin:0}
.day{font-size:13px;font-weight:500;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:99px;border:1px solid var(--line-2)}
.day i{width:6px;height:6px;border-radius:50%;background:var(--lens);display:none;box-shadow:0 0 0 0 var(--lens);animation:pulse 1.6s ease-out infinite}
.day.live i{display:inline-block}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--lens) 60%,transparent)}100%{box-shadow:0 0 0 7px transparent}}
.stage{position:relative;margin:var(--stage-m);height:clamp(236px,calc(100svh - 330px),408px);background:var(--stage-bg);border-radius:var(--stage-r);box-shadow:var(--stage-shadow),inset 0 0 0 1px var(--stage-edge);overflow:hidden}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.tags{position:absolute;inset:0;pointer-events:none}
.tag{position:absolute;left:0;top:0;font-size:11px;font-weight:600;letter-spacing:.01em;white-space:nowrap;color:var(--c);opacity:0;transition:opacity .6s;transform:translate(-50%,-50%);text-shadow:0 0 10px var(--g-bg),0 0 3px var(--g-bg)}
.tag.on{opacity:1}
.tag.dim{color:var(--g-ink-3);font-weight:500}
.tag.live{color:var(--g-lens)}
.tag.on.dim{opacity:.75}
.nef{display:flex;gap:11px;align-items:flex-start;margin:6px 2px 0}
.nef .iris{flex:none;width:26px;height:26px;border-radius:50%;margin-top:1px;background:radial-gradient(circle at 50% 50%,#05080c 0 28%,transparent 29%),conic-gradient(from 40deg,var(--iris-1),var(--iris-2),var(--iris-1),var(--iris-2),var(--iris-1));box-shadow:0 0 14px color-mix(in srgb,var(--iris-1) 45%,transparent)}
.nef p{margin:0;font-size:16.5px;line-height:1.38;font-weight:500;color:var(--ink);text-wrap:pretty}
.nef .live{color:var(--lens)}
.areas{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:8px}
.area{width:100%;appearance:none;text-align:left;font:inherit;color:inherit;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;column-gap:10px;row-gap:2px;align-items:center;padding:11px 14px;border-radius:16px;background:var(--chip);border:1px solid var(--line);transition:border-color .3s,background .3s,opacity .3s}
.area .dot{grid-row:1/3;width:10px;height:10px;border-radius:50%;border:1.5px solid var(--c);background:transparent}
.area.up .dot,.area.live .dot{background:var(--c);box-shadow:0 0 10px var(--c)}
.area.live .dot{background:var(--lens);border-color:var(--lens);box-shadow:0 0 10px var(--lens);animation:pulse2 1s ease-in-out infinite}
@keyframes pulse2{50%{transform:scale(.7)}}
.area .nm{font-weight:600;font-size:15px}
.area .v{grid-column:2;font-size:13px;color:var(--ink-2)}
.area .st{grid-column:3;grid-row:1/3;font-size:12px;font-weight:600;color:var(--ink-3);text-align:right;max-width:9.5em;line-height:1.25}
.area.up .st{color:var(--ok)}
.area.live .st{color:var(--lens)}
.area.up{background:linear-gradient(90deg,color-mix(in srgb,var(--c) 9%,var(--chip)),var(--chip) 70%)}
.area[aria-expanded="true"]{border-color:color-mix(in srgb,var(--c) 55%,transparent)}
.areas.focus .area[aria-expanded="false"]{opacity:.55}
.det{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease}
.det>div{overflow:hidden}
.det p{margin:0;padding:8px 14px 4px 34px;font-size:13.5px;line-height:1.45;color:var(--ink-2)}
.det b{color:var(--ink);font-weight:600}
.open .det{grid-template-rows:1fr}
.note{margin:18px 2px 0;font-size:11.5px;line-height:1.4;color:var(--ink-3)}
@media (max-width:340px){
  h1{font-size:22px}
  header{margin-top:12px}
  .nef p{font-size:15px}
  .seg button{font-size:12px;padding:7px 2px}
}
@media (prefers-reduced-motion: reduce){
  .day i,.area.live .dot{animation:none}
}

<script>
const AREAS = ['goz', 'dikkat', 'nefes', 'ruh', 'hareket']
const NAME = { goz: 'Göz', dikkat: 'Dikkat', nefes: 'Nefes', ruh: 'Ruh hâli', hareket: 'Hareket' }
const WORD = { start: 'Başlangıç', up: 'Başlangıcından iyi', same: 'Değişim yok', unsure: 'Henüz belli değil', live: 'Şu an' }
const DAYS = {
  '30': { label: '30. gün', blinks: 5, nef: 'Üç alanda başlangıcından iyisin: dikkat, nefes ve ruh hâli.', a: {
    goz: { st: 'same', v: 'E testi 0,20 → 0,20', d: '<b>E testi</b> 6 ölçümde başlangıcınla aynı (küçük değer iyi). İlk Bakış: 20 saniyede 5 kırpma; gözlerin bu hızla kırpıyor.' },
    dikkat: { st: 'up', v: '4 → 6 harf', d: '<b>Tek Bakışta</b> kavradığın harf 14 ölçümde 4\'ten 6\'ya çıktı.' },
    nefes: { st: 'up', v: '+1,3 sakinlik', d: '<b>Nefesten sonra</b> sakinlik puanın 24 oturumda ortalama 1,3 yüksek (5 üzerinden).' },
    ruh: { st: 'up', v: 'İyi oluş 56 → 68', d: '<b>İyi oluş</b> (WHO-5) puanın 56\'dan 68\'e çıktı; 10 puandan büyük fark.' },
    hareket: { st: 'unsure', v: 'Bugün 7.080 adım', d: '<b>Apple Sağlık:</b> bugün 7.080 adım. Adım geçmişi henüz kaydedilmediği için karşılaştırma yok.' },
  } },
  '1': { label: '1. gün', blinks: 3, nef: 'Başlangıcın ölçüldü. Bundan sonraki her ölçüm buna göre yanacak.', a: {
    goz: { st: 'start', v: '20 sn\'de 3 kırpma', d: '<b>İlk Bakış</b> 20 saniyede 3 kırpma ölçtü; gözlerin bu hızla kırpıyor. E testi de alındı.' },
    dikkat: { st: 'start', v: '4 harf', d: '<b>Tek Bakışta</b> ilk ölçümün: 4 harf.' },
    nefes: { st: 'start', v: 'Sakinlik 2 → 4', d: '<b>İlk nefesinde</b> sakinlik puanın 2\'den 4\'e çıktı (5 üzerinden).' },
    ruh: { st: 'start', v: 'İyi oluş 56', d: '<b>İyi oluş</b> (WHO-5) ilk puanın: 56. Sonraki 14. gün.' },
    hareket: { st: 'start', v: 'Bugün 3.412 adım', d: '<b>Apple Sağlık:</b> bugün 3.412 adım.' },
  } },
}
DAYS.walk = JSON.parse(JSON.stringify(DAYS['30']))
Object.assign(DAYS.walk, { label: 'Şu an', nef: '<span class="live">Şu an yürüyorsun:</span> 14 dakikada 1,2 km, 1.690 adım.' })
DAYS.walk.a.hareket = { st: 'live', v: '1.690 adım · 14 dk', d: '<b>Yürüyüş sürüyor:</b> 1,2 km, 1.690 adım. Hareket bölgesi adım temponla akıyor.' }

// ---- state ----
const HASH = { d30: '30', walk: 'walk', d1: '1' }
const RHASH = { '30': 'd30', walk: 'walk', '1': 'd1' }
let cur = HASH[location.hash.slice(1)] || '30'
let focus = -1
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches

const $ = (s) => document.querySelector(s)
const segBtns = [...document.querySelectorAll('.seg button')]
const areasEl = $('#areas'), tagsEl = $('#tags')
const tags = AREAS.map((k) => { const t = document.createElement('span'); t.className = 'tag'; t.textContent = NAME[k]; t.style.setProperty('--c', `var(--g-${k})`); tagsEl.appendChild(t); return t })

function render(){
  const D = DAYS[cur]
  segBtns.forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.s === cur)))

  AREAS.forEach((k, i) => {
    const a = D.a[k]
    const li = document.createElement('li')
    li.innerHTML = `<button type="button" class="area ${a.st}" aria-expanded="false" style="--c:var(--a-${k})"><span class="dot"></span><span class="nm">${NAME[k]}</span><span class="st">${WORD[a.st]}</span><span class="v">${a.v}</span></button><div class="det"><div><p>${a.d}</p></div></div>`
    li.firstChild.addEventListener('click', () => setFocus(focus === i ? -1 : i))
    areasEl.appendChild(li)
  })

  $('#head').setAttribute('aria-label', 'Işıktan bir baş, yandan dörtte üç açıdan. ' + (lit.length ? 'Parlayan bölgeler: ' + lit.join(', ') + '.' : 'Bütün bölgeler sakin; başlangıç ölçüldü.') + ` Gözler 20 saniyede ${D.blinks} kez kırpıyor.`)

  cur = b.dataset.s

addEventListener('hashchange', () => { const s = HASH[location.hash.slice(1)]; if (s && s !== cur) { cur = s; render(); if (scene) scene.kick() } })

// ---- scene ----

out vec4 o;
uniform vec2 uRes;
uniform float uTh;        // tan(half fov) * 2
uniform mat3 uMi;         // world -> head rotation
uniform vec3 uCamH;       // camera in head space
uniform float uT;
uniform float uBlink;
uniform vec3 uGaze;       // gaze direction, head space
uniform vec4 uB[20];      // metaballs: xyz, radius (4 per region)
uniform vec4 uV[20];      // motion trail of each ball (xyz), zero when still
uniform vec4 uRC[5];      // region colour rgb, brightness
uniform vec4 uRP[5];      // region centre xyz, live
uniform vec3 uIris1;
uniform vec3 uIris2;
uniform vec3 uKey;        // key light dir (head space)
uniform vec3 uStrip;
uniform vec3 uRim;        // rim light dir (head space)
uniform vec3 uUp;         // world up (head space)
uniform float uEyeOn;     // eye glow strength

  vec3 ba=b-a; float l2=dot(ba,ba); float rr=r1-r2; float a2=l2-rr*rr; float il2=1.0/l2;

vec3 eyeFrame(vec3 p){
  vec3 q = vec3(abs(p.x), p.y, p.z) - EYE_C;
  q.xz = rot2(-0.18) * q.xz;     // eye axis turned a little outward
  return q;

float eyeSlot(vec3 p){
  vec3 q = eyeFrame(p);
  float w = 0.108;
  float x = q.x / w;
  float xc = clamp(x, -1.0, 1.0);
  float y = q.y - 0.010 * xc;                       // slight upward canthal tilt
  float ht = 0.064 * (1.0 - 0.18 * xc);             // upper lid peaks toward the nose
  float hb = 0.040 * (1.0 + 0.12 * xc);

  float k0 = length(v / rr), k1 = length(v / (rr * rr));

float skullBase(vec3 p){
  vec3 q = vec3(abs(p.x), p.y, p.z);
  // neurocranium
  float d = sdEll(p - vec3(0.0, 0.40, -0.15), vec3(0.68, 0.67, 0.86));
  // parietal fullness (back-top is the widest part of the head)
  d = smin(d, sdEll(q - vec3(0.16, 0.43, -0.36), vec3(0.57, 0.56, 0.58)), 0.30);
  // lower cranium / temporal sides
  d = smin(d, sdEll(p - vec3(0.0, 0.02, -0.24), vec3(0.64, 0.56, 0.74)), 0.32);
  // forehead
  vec3 fh = p - vec3(0.0, 0.36, 0.25);
  fh.yz = rot2(0.22) * fh.yz;           // forehead slopes back a little (adult, not infant)
  d = smin(d, sdEll(fh, vec3(0.58, 0.56, 0.55)), 0.30);
  // midface
  d = smin(d, sdEll(p - vec3(0.0, -0.22, 0.27), vec3(0.60, 0.50, 0.59)), 0.30);
  // lower face continuation (fades out)
  d = smin(d, sdEll(p - vec3(0.0, -0.78, 0.28), vec3(0.48, 0.58, 0.54)), 0.30);
  // side of the face between cheekbone and ear
  d = smin(d, sdEll(q - vec3(0.50, -0.30, 0.18), vec3(0.15, 0.26, 0.30)), 0.22);

  d = smin(d, sdCap(p, vec3(0.0,-0.30,-0.42), vec3(0.0,-1.7,-0.32), 0.47), 0.36);
  // cheekbones
  d = smin(d, sdEll(q - vec3(0.44, -0.13, 0.47), vec3(0.22, 0.12, 0.22)), 0.24);

  d = smin(d, sdEll(q - vec3(0.30, -0.24, 0.58), vec3(0.21, 0.16, 0.18)), 0.24);

  d = smin(d, sdEll(q - vec3(0.25, 0.155, 0.715), vec3(0.24, 0.075, 0.13)), 0.15);

  float nb = sdRC(p, vec3(0.0, 0.07, 0.80), vec3(0.0, -0.33, 1.03), 0.042, 0.060);
  float tip = sdEll(p - vec3(0.0, -0.375, 1.03), vec3(0.070, 0.066, 0.074));
  float ala = sdEll(q - vec3(0.080, -0.405, 0.935), vec3(0.045, 0.042, 0.055));

  d = smin(d, ear, 0.08);
  return d;
}

// skin with the lid opening cut through it, and the eyeball kept strictly inside the uncut skin
// (so it only ever shows through the opening). x = skin, y = eyeball
vec2 parts(vec3 p){
  float b = skullBase(p);
  float s = smax(b, -eyeSlot(p), 0.024);
  vec3 q = vec3(abs(p.x), p.y, p.z) - EYE_C;
  float e = max(length(q) - EYE_R, b + 0.014);   // margin > smax blend depth (k/4), so the two never z-fight

float map(vec3 p){ vec2 v = parts(p); return min(v.x, v.y); }

vec3 nrm(vec3 p){
  const vec2 e = vec2(0.0012, -0.0012);
  return normalize(e.xyy*map(p+e.xyy) + e.yyx*map(p+e.yyx) + e.yxy*map(p+e.yxy) + e.xxx*map(p+e.xxx));

float ign(vec2 f){ return fract(52.9829189 * fract(dot(f, vec2(0.06711056, 0.00583715)))); }

vec2 sph(vec3 ro, vec3 rd, float r){

  h = sqrt(h); return vec2(-b - h, -b + h);
}

  }
  let sac = [0, 0], sacT = 0
  const lerp = (a, b, k) => a + (b - a) * k

  function frame(t, dtS){
    const D = DAYS[cur]
    const light = pal.light
    // brightness targets from data
    AREAS.forEach((k, i) => {
      const st = D.a[k].st
      let b = st === 'up' || st === 'live' ? 1 : 0.32
      // selecting an area singles it out; it never shines brighter than its own data allows
      if (focus >= 0) b = i === focus ? Math.max(b, 0.42) : b * 0.16
      bright[i] = lerp(bright[i], b, 1 - Math.exp(-dtS * 3))
      tint[i] = lerp(tint[i], st === 'live' ? 1 : 0, 1 - Math.exp(-dtS * 3))
    })
    // head pose: three-quarter view, slow drift
    let yaw = 0.62 + 0.085 * Math.sin(t * 0.19) + 0.02 * Math.sin(t * 0.47)
    const pitch = -0.02 + 0.02 * Math.sin(t * 0.17 + 1.3)
    const breath = Math.sin(t * (Math.PI * 2 / 5.6))
    const S = 1 + 0.012 * breath
    const cy = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch)
    // R = Ry * Rx (head -> world)
    const R = [
      [cy, sy * sp, sy * cp],
      [0, cp, -sp],
      [-sy, cy * sp, cy * cp],
    ]
    const toWorld = (p) => { const d = [p[0] - PIV[0], p[1] - PIV[1], p[2] - PIV[2]]; return [0, 1, 2].map((r) => S * (R[r][0] * d[0] + R[r][1] * d[1] + R[r][2] * d[2]) + OFF[r]) }
    const toHeadDir = (w) => [0, 1, 2].map((c) => R[0][c] * w[0] + R[1][c] * w[1] + R[2][c] * w[2])
    const cam = [0, 0, DIST]
    const cd = [(cam[0] - OFF[0]) / S, (cam[1] - OFF[1]) / S, (cam[2] - OFF[2]) / S]
    const camH = toHeadDir(cd).map((v, i) => v + PIV[i])
    // uMi = R^T (column-major for GLSL)
    const Mi = new Float32Array([R[0][0], R[0][1], R[0][2], R[1][0], R[1][1], R[1][2], R[2][0], R[2][1], R[2][2]])
    // framing
    const aspect = W / H
    let half = Math.max(1.02, 1.05 / aspect)
    const th = 2 * half / DIST

    // gaze: toward the viewer, softened, with small saccades
    if (t > sacT) { sacT = t + 1.2 + Math.random() * 2.2; sac = [(Math.random() - 0.5) * 0.10, (Math.random() - 0.5) * 0.06] }
    const eyeMid = [0, 0.0, 0.66]
    const toCam = [camH[0] - eyeMid[0], camH[1] - eyeMid[1], camH[2] - eyeMid[2]]
    const l = Math.hypot(...toCam)
    let g = [toCam[0] / l * 0.55 + sac[0], toCam[1] / l * 0.55 + sac[1] - 0.02, 1]
    const gl2 = Math.hypot(...g); g = g.map((v) => v / gl2)

    // metaballs
    const balls = new Float32Array(80), trails = new Float32Array(80)
    const walkTempo = 2.0 // steps per second while walking
    AREAS.forEach((k, i) => {
      const c = CENTRE[k]
      for (let j = 0; j < 4; j++) {
        let x, y, z, r
        const ph = i * 1.7 + j * 2.1
        if (k === 'hareket') {
          // a band across the crown; when live the beads travel along it
          const flow = tint[i]
          const s0 = j / 4 + (flow > 0.01 ? t * 0.16 : 0)
          const s = ((s0 % 1) + 1) % 1
          const still = -0.9 + j * 0.6
          const a = lerp(still, -1.25 + s * 2.5, flow)
          x = Math.sin(a) * 0.55
          y = c[1] + (Math.cos(a) - 1) * 0.42 + 0.06
          z = c[2] + 0.03 * Math.sin(t * 0.7 + ph)
          const step = 0.5 + 0.5 * Math.sin(t * walkTempo * Math.PI)
          r = lerp(0.085 + 0.02 * Math.sin(t * 0.8 + ph), 0.07 + 0.012 * step, flow)
          // motion trail along the band (points forward; the shader draws it behind the bead)
          const tl = 0.34 * flow
          trails.set([Math.cos(a) * 0.55 * tl, -Math.sin(a) * 0.42 * tl, 0], (i * 4 + j) * 4)
        } else {
          const sp = k === 'dikkat' ? [0.20, 0.08, 0.06] : k === 'goz' ? [0.16, 0.09, 0.07] : k === 'ruh' ? [0.14, 0.07, 0.10] : [0.08, 0.10, 0.08]
          x = c[0] + sp[0] * Math.sin(t * (0.23 + j * 0.05) + ph)
          y = c[1] + sp[1] * Math.sin(t * (0.31 + j * 0.04) + ph * 1.3)
          z = c[2] + sp[2] * Math.sin(t * (0.27 + j * 0.06) + ph * 0.7)
          r = (k === 'nefes' ? 0.085 + 0.02 * (0.5 + 0.5 * breath) : 0.092) + 0.012 * Math.sin(t * 0.9 + ph)
        }
        balls.set([x, y, z, r], (i * 4 + j) * 4)
      }
    })
    const rc = new Float32Array(20), rp = new Float32Array(20)
    AREAS.forEach((k, i) => {
      const lit = Math.min(1, Math.max(0, (bright[i] - 0.32) / 0.5))
      const grey = [0.55, 0.62, 0.72]
      const base = pal.a[i].map((v, c) => lerp(lerp(v, grey[c], 0.55), v, lit))
      const col = base.map((v, c) => lerp(v, pal.lens[c], tint[i]))
      let b = bright[i]
      if (tint[i] > 0.01) b *= 1 + 0.25 * tint[i] * (0.6 + 0.4 * Math.sin(t * walkTempo * Math.PI))
      if (k === 'nefes') b *= 0.9 + 0.1 * breath
      rc.set([col[0], col[1], col[2], b], i * 4)
      rp.set([...CENTRE[k], tint[i]], i * 4)
    })

    gl.viewport(0, 0, cv.width, cv.height)
    gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT)
    gl.uniform2f(U.uRes, cv.width, cv.height)
    gl.uniform1f(U.uTh, th)
    gl.uniformMatrix3fv(U.uMi, false, Mi)
    gl.uniform3fv(U.uCamH, camH)
    gl.uniform1f(U.uT, t)
    let bl = reduce ? 0 : blinkAmt(t)
    gl.uniform1f(U.uBlink, bl)
    gl.uniform3fv(U.uGaze, g)
    gl.uniform4fv(U.uB, balls)
    gl.uniform4fv(U.uV, trails)
    gl.uniform4fv(U.uRC, rc)
    gl.uniform4fv(U.uRP, rp)
    gl.uniform3fv(U.uIris1, pal.i1)
    gl.uniform3fv(U.uIris2, pal.i2)
    const nz = (v) => { const l = Math.hypot(...v); return v.map((x) => x / l) }
    gl.uniform3fv(U.uKey, toHeadDir(nz([0.55, 0.62, 0.62])))
    gl.uniform3fv(U.uStrip, toHeadDir(nz([-0.2, 1, 0.3])))
    gl.uniform3fv(U.uRim, toHeadDir(nz([-0.85, 0.25, -0.45])))
    gl.uniform3fv(U.uUp, toHeadDir([0, 1, 0]))
    gl.uniform1f(U.uEyeOn, 1)
    gl.drawArrays(gl.TRIANGLES, 0, 3)

    // area names float beside the lit areas
    AREAS.forEach((k, i) => {
      const st = DAYS[cur].a[k].st
      const on = st === 'up' || st === 'live'
      const show = focus >= 0 ? i === focus : true
      tags[i].classList.toggle('dim', focus < 0 && !on)
      tags[i].classList.toggle('live', st === 'live')
      const w = toWorld(CENTRE[k])
      const z = DIST - w[2]
      const px = W / 2 + (w[0] / (z * th)) * H
      const py = H / 2 - (w[1] / (z * th)) * H
      tags[i].style.transform = `translate(${px.toFixed(1)}px, ${(py - 2).toFixed(1)}px) translate(-50%, -50%)`
      tags[i].classList.toggle('on', show)
    })
  }

  // first paint shows the data at once (no fade-in); later state changes glide
  frame(0, 10)
  let last = performance.now(), t0 = last, raf = 0, running = false
  function loop(now){
    const dtS = Math.min(0.1, (now - last) / 1000); last = now
    let tt = (now - t0) / 1000
    frame(tt, dtS)
    // adaptive quality: sustained frames over ~24 ms drop the render scale one step
    slow = dtS > 0.024 ? slow + 1 : Math.max(0, slow - 1)
    if (slow > 40 && qi < QUAL.length - 1) { qi++; slow = 0; size() }
    raf = requestAnimationFrame(loop)
  }
  function kick(){
    if (reduce) {
      // one calm, fully settled frame (a long dt settles every transition at once)
      frame(8.0, 10)
      return
    }
    if (!running) { running = true; last = performance.now(); raf = requestAnimationFrame(loop) }
  }
  document.addEventListener('visibilitychange', () => { if (document.hidden) { cancelAnimationFrame(raf); running = false } else kick() })
  return { kick }
})()

render()
if (scene) scene.kick()
</script>
