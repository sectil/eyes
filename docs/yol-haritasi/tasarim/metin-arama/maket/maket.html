<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kelime Avı · maket</title>
<link rel="stylesheet" href="fonts/fonts.css">
<script src="metinler.global.js"></script>
<style>
:root {
  --font-display: 'Unbounded', system-ui, sans-serif; --font-body: 'Onest', system-ui, sans-serif; --font-mono: ui-monospace, 'SF Mono', monospace;
  --bg: #f3f6f8; --surface: #fff; --surface-2: #e9eef2; --border: #e1e7ec; --ink: #0b1219; --ink-2: #33414d; --ink-3: #5b6976;
  --accent: #0b7480; --accent-g: #11a9b8; --accent-grad: linear-gradient(90deg, #0b7480, #2458cc); --accent-ink: #fff;
  --hl: rgba(17,169,184,.18); --hl-ring: #0b7480;
  --ok: #13704b; --ok-bg: rgba(31,169,116,.13); --no: #b4431c; --no-bg: rgba(232,96,62,.12);
  --paper: #fbf8f2; --paper-ink: #1f1a14; --paper-line: #ece4d6;
}
:root[data-theme="dark"] {
  --bg: #070c12; --surface: #0f171f; --surface-2: #141e28; --border: rgba(255,255,255,.08); --ink: #eef3f6; --ink-2: #b9c4cd; --ink-3: #8b98a5;
  --accent: #19c2d1; --accent-g: #19c2d1; --accent-grad: linear-gradient(90deg, #19c2d1, #3e7bfa); --accent-ink: #041017;
  --hl: rgba(25,194,209,.2); --hl-ring: #19c2d1;
  --ok: #35d39a; --ok-bg: rgba(53,211,154,.14); --no: #ff9a7d; --no-bg: rgba(255,122,89,.14);
  --paper: #121a22; --paper-ink: #eef1f3; --paper-line: rgba(255,255,255,.07);
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; background: var(--bg); color: var(--ink); font-family: var(--font-body); -webkit-font-smoothing: antialiased; overflow: hidden; }
.page { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
.status { height: 47px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 28px 0 34px; font-weight: 700; font-size: 16px; }
.status i { font-style: normal; letter-spacing: 2px; font-size: 13px; }
.body { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 0 20px 22px; gap: 14px; }
.top { display: flex; align-items: center; gap: 14px; flex: none; }
.x { width: 42px; height: 42px; border-radius: 14px; border: 1px solid var(--border); background: var(--surface); display: grid; place-items: center; color: var(--ink-2); flex: none; }
.dots { flex: 1; display: flex; gap: 6px; }
.dots i { flex: 1; height: 6px; border-radius: 3px; background: var(--surface-2); }
.dots i.on { background: var(--accent-grad); }
.dots i.now { background: var(--accent-g); opacity: .45; }
.cnt { font: 700 14px var(--font-body); color: var(--ink-2); min-width: 30px; text-align: right; }
.ey { font-family: var(--font-mono); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
h1 { font-family: var(--font-display); font-weight: 700; font-size: 30px; line-height: 1.08; letter-spacing: -.02em; }
.lead { font-size: 17px; color: var(--ink-2); line-height: 1.42; }
.btn { flex: none; height: 56px; border-radius: 18px; border: 0; background: var(--accent-grad); color: var(--accent-ink); font: 700 18px var(--font-body); display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 10px 26px -12px rgba(36,88,204,.6); width: 100%; }
.btn.ghost { background: var(--surface); color: var(--ink); box-shadow: none; border: 1.5px solid var(--border); font-size: 17px; }
.small { font-size: 12.5px; color: var(--ink-3); line-height: 1.4; }
.small a { color: var(--accent); font-weight: 700; text-decoration: none; }
/* aranan kelime */
.seek { flex: none; display: flex; align-items: center; gap: 14px; padding: 14px 16px 16px; border-radius: 22px; background: var(--surface); border: 1px solid var(--border); position: relative; overflow: hidden; }
.seek .lbl { font: 600 13px var(--font-body); color: var(--ink-3); }
.seek .w { font: 700 26px var(--font-display); letter-spacing: -.01em; color: var(--ink); line-height: 1.15; }
.seek .t { position: absolute; left: 0; bottom: 0; height: 4px; background: var(--accent-grad); border-radius: 0 2px 2px 0; }
.seek .chip { margin-left: auto; }
.lens { width: 40px; height: 40px; border-radius: 13px; background: var(--hl); display: grid; place-items: center; flex: none; color: var(--accent); }
/* metin */
.paper { flex: 1; min-height: 0; border-radius: 22px; background: var(--paper); color: var(--paper-ink); padding: 18px 18px 14px; display: flex; flex-direction: column; border: 1px solid var(--paper-line); }
.paper p { font-size: 19px; line-height: 1.58; letter-spacing: .003em; }
.paper .src { margin-top: auto; padding-top: 10px; border-top: 1px solid var(--paper-line); font-size: 12px; color: var(--ink-3); display: flex; justify-content: space-between; gap: 8px; }
.tk { border-radius: 7px; padding: 0 2px; margin: 0 -2px; }
.tk.found { background: var(--hl); box-shadow: 0 0 0 2px var(--hl-ring); font-weight: 700; }
.tk.done { background: var(--hl); }
.tk.near { text-decoration: underline dashed var(--ink-3); text-underline-offset: 4px; text-decoration-thickness: 1.5px; }
.chip { display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 12px; border-radius: 16px; font-weight: 700; font-size: 14px; white-space: nowrap; }
.chip.ok { background: var(--ok-bg); color: var(--ok); }
.note { flex: none; display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-radius: 18px; background: var(--ok-bg); color: var(--ok); font-weight: 700; font-size: 15px; }
.note span { color: var(--ink-2); font-weight: 500; }
/* giriş önizleme */
.steps { flex: none; display: grid; gap: 8px; }
.steps div { display: flex; gap: 12px; align-items: center; font-size: 15.5px; color: var(--ink-2); }
.steps b { width: 28px; height: 28px; border-radius: 9px; background: var(--surface-2); color: var(--ink); display: grid; place-items: center; font-size: 14px; flex: none; }
/* sonuç */
.big { font: 700 64px var(--font-display); letter-spacing: -.03em; line-height: 1; }
.big small { font-size: 26px; font-weight: 600; color: var(--ink-2); margin-left: 6px; letter-spacing: 0; }
.rows { display: grid; gap: 8px; flex: none; }
.r { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 16px; background: var(--surface); border: 1px solid var(--border); font-size: 15px; color: var(--ink-2); }
.r b { margin-left: auto; color: var(--ink); font-size: 16px; }
.gel { flex: none; padding: 14px; border-radius: 18px; background: var(--surface-2); display: grid; gap: 8px; }
.gel .h { display: flex; justify-content: space-between; font-size: 14px; color: var(--ink-2); }
.gel .h b { color: var(--ink); }
.gel .seg { display: flex; gap: 4px; }
.gel .seg i { flex: 1; height: 6px; border-radius: 3px; background: var(--border); }
.gel .seg i.on { background: var(--accent-g); }
.facts { display: grid; gap: 8px; flex: none; }
.fact { padding: 12px 14px; border-radius: 16px; background: var(--paper); border: 1px solid var(--paper-line); }
.fact b { display: block; font-size: 15px; color: var(--paper-ink); }
.fact span { font-size: 12px; color: var(--ink-3); }
.sp { flex: 1; min-height: 0; }
.demo { flex: 1; min-height: 0; border-radius: 26px; background: var(--paper); border: 1px solid var(--paper-line); padding: 14px; display: flex; flex-direction: column; gap: 14px; overflow: hidden; position: relative; }
.dseek { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 18px; background: var(--surface); border: 1px solid var(--border); }
.dseek .lbl { font: 600 12px var(--font-body); color: var(--ink-3); } .dseek .w { font: 700 20px var(--font-display); }
.dtext { font-size: 21px; line-height: 1.6; color: var(--paper-ink); padding: 0 6px; -webkit-mask-image: linear-gradient(180deg, #000 70%, transparent); mask-image: linear-gradient(180deg, #000 70%, transparent); }
.dtext { color: color-mix(in srgb, var(--paper-ink) 55%, transparent); }
.hunt { color: var(--paper-ink); font-weight: 700; border-radius: 9px; padding: 1px 6px; background: var(--hl); box-shadow: 0 0 0 2.5px var(--hl-ring), 0 0 0 9px var(--hl), 0 8px 30px -6px var(--hl-ring); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; flex: none; }
.stat { padding: 12px; border-radius: 18px; background: var(--surface); border: 1px solid var(--border); }
.stat b { display: block; font: 700 22px var(--font-display); letter-spacing: -.01em; }
.stat span { display: block; font-size: 12.5px; color: var(--ink-3); margin-top: 4px; line-height: 1.25; }
.fact { display: flex; align-items: center; gap: 10px; }
.fact b { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fact span { flex: none; }
@media (max-width: 340px) { .dtext { font-size: 17px; } .dseek .w { font-size: 17px; } .stat { padding: 9px; } .stat b { font-size: 19px; } .stat span { font-size: 11.5px; } .demo { gap: 10px; padding: 10px; } }

@media (max-width: 340px) {
  .body { padding: 0 16px 16px; gap: 10px; }
  h1 { font-size: 25px; } .lead { font-size: 15.5px; }
  .paper p { font-size: 16.5px; line-height: 1.5; } .paper { padding: 14px 14px 10px; }
  .seek { padding: 10px 12px 12px; } .seek .w { font-size: 21px; } .lens { width: 34px; height: 34px; }
  .btn { height: 50px; font-size: 17px; } .big { font-size: 52px; }
  .r { padding: 9px 12px; font-size: 14px; } .status { height: 30px; font-size: 14px; }
  .steps div { font-size: 14px; } .fact { padding: 9px 12px; } .note { font-size: 14px; padding: 10px 12px; }
}

/* tur 2 */
.seek.ok { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 8%, var(--surface)); }
.seek.ok .lens { background: var(--ok-bg); color: var(--ok); }
.seek.ok .t { background: var(--ok); }
.seek .time { margin-left: auto; font: 600 16px var(--font-body); color: var(--ok); white-space: nowrap; }
.seek .time b { font: 700 30px var(--font-display); letter-spacing: -.02em; }
.tk.found { background: var(--accent-grad); color: var(--accent-ink); font-weight: 700; padding: 1px 6px; margin: 0 -4px; border-radius: 9px; box-shadow: 0 0 0 4px var(--hl), 0 0 0 10px color-mix(in srgb, var(--hl) 50%, transparent), 0 10px 26px -6px var(--hl-ring); }
.tk.near { text-decoration-color: var(--accent); text-decoration-style: dashed; text-decoration-thickness: 2px; }
.demo { flex: none; }
.dtext { -webkit-mask-image: none; mask-image: none; color: color-mix(in srgb, var(--paper-ink) 60%, transparent); padding: 4px 6px 8px; }
.fact { display: block; }
.fact b { white-space: normal; }
.fact span { display: block; margin-top: 2px; }
.gs { font-size: 12.5px; color: var(--ink-3); line-height: 1.35; }
@media (max-width: 340px) {
  .seek { gap: 10px; } .seek .lbl { display: none; } .seek .w { font-size: 20px; } .seek .time b { font-size: 24px; }
  .paper p { font-size: 16.5px; line-height: 1.5; } .btn.ghost { height: 48px; }
  .facts { gap: 6px; } .fact span { font-size: 11px; } .fact b { font-size: 14px; } .gel { padding: 10px 12px; gap: 6px; } .gs { font-size: 11.5px; }
  .big { font-size: 46px; } .big small { font-size: 21px; } .lead { font-size: 15px; } .stat span { font-size: 11px; }
}

@media (max-width: 340px) {
  .body { gap: 8px; }
  .paper p { font-size: 16px; line-height: 1.45; } .paper { padding: 12px 13px; }
  .steps { gap: 4px; } .steps div { font-size: 13.5px; } .steps b { width: 24px; height: 24px; font-size: 12.5px; }
  .dtext { font-size: 16px; line-height: 1.5; padding: 0 4px 4px; } .dseek { padding: 7px 10px; } .dseek .lbl { display: none; }
  .gs, .facts .small { display: none; } .big { font-size: 42px; } .stat { padding: 8px; } .stat b { font-size: 18px; }
}

/* yönler */
.ring { margin-left: auto; width: 54px; height: 54px; border-radius: 50%; flex: none; display: grid; place-items: center; background: conic-gradient(var(--accent-g) calc(var(--p) * 360deg), var(--surface-2) 0); position: relative; }
.ring::before { content: ''; position: absolute; inset: 5px; border-radius: 50%; background: var(--surface); }
.ring b { position: relative; font: 700 19px var(--font-display); }
.paper.lg p { font-size: 20px; line-height: 1.6; }
.paper.tabbed { padding-top: 0; position: relative; }
.paper.tabbed .tab { display: flex; align-items: center; gap: 10px; margin: 0 -18px; padding: 14px 18px 12px; border-bottom: 1px solid var(--paper-line); }
.paper.tabbed .tab span { color: var(--accent); display: grid; } .paper.tabbed .tab b { font: 700 26px var(--font-display); color: var(--accent); }
.paper.tabbed .tab i { margin-left: auto; font: 700 15px var(--font-body); font-style: normal; color: var(--ink-2); background: var(--surface-2); padding: 6px 10px; border-radius: 12px; }
.tline { height: 4px; margin: 0 -18px 14px; background: var(--paper-line); } .tline i { display: block; height: 100%; background: var(--accent-grad); }
.paper.tabbed p { font-size: 20px; line-height: 1.6; }
.hero { flex: none; text-align: center; padding: 6px 0 2px; }
.hero .lbl { font: 600 13px var(--font-body); color: var(--ink-3); }
.hero .hw { font: 700 40px var(--font-display); letter-spacing: -.02em; background: var(--accent-grad); -webkit-background-clip: text; background-clip: text; color: transparent; line-height: 1.15; }
.hrow { display: flex; align-items: center; gap: 10px; margin-top: 8px; } .hl { flex: 1; height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; } .hl i { display: block; height: 100%; background: var(--accent-grad); } .hrow b { font: 700 16px var(--font-display); min-width: 24px; }
.paper.bar { border-left: 4px solid var(--accent-g); } .paper.bar p { font-size: 19.5px; line-height: 1.6; }
.paper.dim p { opacity: .5; }
.paper .tk.near { opacity: 1; }
.sheet { flex: none; display: flex; gap: 14px; align-items: flex-start; padding: 18px; border-radius: 24px; background: var(--surface); border: 1.5px solid var(--ok); box-shadow: 0 -10px 30px -18px rgba(0,0,0,.35); margin-top: -90px; position: relative; }
.sheet b { font: 700 19px var(--font-display); color: var(--ok); } .sheet p { font-size: 14.5px; color: var(--ink-2); margin: 6px 0 8px; }
.big-ok { width: 48px; height: 48px; border-radius: 16px; background: var(--ok-bg); color: var(--ok); display: grid; place-items: center; flex: none; } .big-ok svg { width: 26px; height: 26px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; } .chips span { padding: 5px 10px; border-radius: 10px; background: var(--surface-2); font-weight: 700; font-size: 15px; text-decoration: line-through; text-decoration-color: var(--ink-3); }
.paper.thick .tk.near { text-decoration-thickness: 3px; text-decoration-color: var(--ok); }
.paper.boxed .tk.near { text-decoration: none; outline: 2px dashed var(--accent); outline-offset: 1px; border-radius: 6px; }
.toast { flex: none; display: flex; gap: 12px; align-items: center; padding: 16px; border-radius: 20px; background: var(--ok); color: #fff; font-size: 16px; } .toast span { opacity: .9; } :root[data-theme="dark"] .toast { color: #04140d; }
.best { flex: none; display: flex; align-items: baseline; gap: 10px; padding: 14px 16px; border-radius: 18px; background: var(--hl); } .best span { font-size: 13px; color: var(--ink-2); } .best b { font: 700 18px var(--font-display); } .best i { margin-left: auto; font-style: normal; font-weight: 800; color: var(--accent); font-size: 16px; }
.bars { flex: none; display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; padding: 12px; border-radius: 18px; background: var(--surface); border: 1px solid var(--border); }
.bar1 { display: grid; justify-items: center; gap: 4px; min-width: 0; } .bar1 .col { height: 70px; width: 100%; display: flex; align-items: flex-end; justify-content: center; } .bar1 i { width: 70%; border-radius: 6px 6px 3px 3px; background: var(--accent-grad); } .bar1 i.okb { background: var(--ok); } .bar1 i.miss { background: var(--surface-2); }
.bar1 b { font-size: 13px; } .bar1 span { font-size: 10.5px; color: var(--ink-3); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rhero .big { line-height: 1.15; padding-bottom: 2px; } .rhero { display: flex; align-items: flex-end; justify-content: space-between; } .rk { text-align: right; } .rk b { display: block; font: 700 30px var(--font-display); color: var(--ok); } .rk span { font-size: 13px; color: var(--ink-3); }
.learn { flex: none; display: grid; gap: 8px; } .lc { padding: 14px; border-radius: 18px; background: var(--paper); border: 1px solid var(--paper-line); } .lc b { display: block; font-size: 16px; color: var(--paper-ink); } .lc span { display: block; font-size: 12px; color: var(--ink-3); margin-top: 3px; }
@media (max-width: 340px) {
  .ring { width: 44px; height: 44px; } .ring b { font-size: 16px; } .paper.lg p, .paper.tabbed p, .paper.bar p { font-size: 16px; line-height: 1.45; }
  .paper.tabbed .tab { padding: 10px 13px 8px; margin: 0 -13px; } .paper.tabbed .tab b { font-size: 21px; } .tline { margin: 0 -13px 8px; }
  .hero .hw { font-size: 27px; } .hero { padding: 0; } .hero .lbl { display: none; } .hrow { margin-top: 4px; }
  .sheet { padding: 12px; margin-top: -70px; } .sheet b { font-size: 16px; } .big-ok { width: 38px; height: 38px; }
  .toast { padding: 11px; font-size: 14px; } .best { padding: 10px 12px; } .best b { font-size: 15px; }
  .bar1 .col { height: 48px; } .bars { padding: 8px; gap: 4px; } .bar1 span { font-size: 9.5px; }
  .lc { padding: 10px; } .lc b { font-size: 14px; } .rk b { font-size: 24px; }
}

/* tur 3 */
.paper.mid { justify-content: center; } .paper.mid p { font-size: 25px; line-height: 1.55; }
.hero .hl i { transition: none; }
.hero.ok .lbl { color: var(--ok); font-weight: 700; display: inline-flex; gap: 6px; align-items: center; font-size: 15px; }
.hero.ok .hw { background: none; color: var(--ok); -webkit-text-fill-color: var(--ok); }
.hero.ok .hl i { background: var(--ok); } .hero.ok .hrow b { color: var(--ok); font-size: 20px; }
.hero .hw s { text-decoration-thickness: 3px; text-decoration-color: color-mix(in srgb, var(--ok) 60%, transparent); }
.hero .why { font-size: 15.5px; color: var(--ink-2); margin-top: 6px; }
.paper.boxed .tk.near { outline: 2px dashed var(--accent); outline-offset: 0; padding: 0 3px; margin: 0 1px; border-radius: 6px; text-decoration: none; }
.best { align-items: center; } .best span { font-size: 15px; color: var(--ink); font-weight: 600; } .best i { font-size: 20px; font-family: var(--font-display); }
.lt { font-size: 14px; font-weight: 700; color: var(--ink-2); }
.lc span { font-size: 13.5px; color: var(--ink-2); } .lc em { font-style: normal; white-space: nowrap; }
.rk span { font-size: 14px; color: var(--ink-2); }
@media (max-width: 340px) {
  .paper.mid p { font-size: 19px; line-height: 1.5; } .hero .why { font-size: 14px; } .hero.ok .lbl { font-size: 14px; display: inline-flex; }
  .lc span { font-size: 12px; } .lt { font-size: 13px; } .best { padding: 9px 12px; } .best span { font-size: 14px; } .best i { font-size: 17px; }
}
</style>

<body>
<div class="page" id="app"></div>
<script>
const q = new URLSearchParams(location.search)
document.documentElement.dataset.theme = q.get('theme') === 'dark' ? 'dark' : 'light'
const S = q.get('s') || 'intro'
const VV = q.get('v') || ''
const X = window.TEXTS[0] // Sıfırı en küçük sayan arılar
const low = (w) => w.toLocaleLowerCase('tr')
const clean = (w) => w.replace(/^[^\p{L}\d]+|[^\p{L}\d]+$/gu, '')
const lens = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>'
const close = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>'
const check = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'
const status = '<div class="status"><span>9:41</span><i>●●● ▲ ▮</i></div>'
// metni kelime kelime çiz; marks: { kelime(küçük) : sınıf }, nearRoot: Y hedefinin kökü
function paper(x, marks = {}, nearRoot = null) {
  const html = x.text.split(/(\s+)/).map((part) => {
    if (/^\s+$/.test(part)) return part
    const c = low(clean(part))
    let cls = marks[c] || ''
    if (!cls && nearRoot && c.startsWith(nearRoot)) cls = 'near'
    return cls ? part.replace(clean(part), `<span class="tk ${cls}">${clean(part)}</span>`) : part
  }).join('')
  return `<div class="paper"><p>${html}</p></div>`
}
const topBar = (done, now) => `<div class="top"><div class="x">${close}</div><div class="dots">${[0,1,2,3,4,5].map((i) => `<i class="${i < done ? 'on' : i === now ? 'now' : ''}"></i>`).join('')}</div><div class="cnt">${now + 1}/6</div></div>`
const seek = (w, t, extra = '', cls = '') => `<div class="seek ${cls}"><div class="lens">${cls ? check : lens}</div><div class="sk"><div class="lbl">Bu kelimeyi bul</div><div class="w">${w}</div></div>${extra}<div class="t" style="width:${t}%"></div></div>`
const V = {

    <div class="top"><div class="x">${close}</div></div>

    <p class="lead">Bilimden kısa bir metin, aranan bir kelime. Bul ve dokun; metinde yoksa “Yok” de.</p>

  found: () => `${status}<div class="body">${topBar(2, 1)}<div class="hero ok"><div class="lbl">${check} Buldun</div><div class="hw">kartı</div><div class="hrow"><div class="hl"><i style="width:48%"></i></div><b>2,8 sn</b></div></div>${paper(X, { kartı: 'found' }).replace('class="paper"', 'class="paper bar mid"')}<button class="btn ghost" style="opacity:.35">Metinde yok</button></div>`,
  absent: () => `${status}<div class="body">${topBar(4, 3)}<div class="hero ok"><div class="lbl">${check} Doğru, metinde yok</div><div class="hw">arıya</div><p class="why">Kesik çizgili kelimeler benzer ama aynı değil.</p></div>${paper(X, {}, 'arı').replace('class="paper"', 'class="paper bar mid boxed"')}<button class="btn">Devam</button></div>`,
  result: () => `${status}<div class="body">
    <div class="top"><div class="x">${close}</div></div>
    <div class="rhero"><div><div class="ey">Tur bitti</div><div class="big" style="margin-top:6px">3,0<small>sn</small></div></div><div class="rk"><b>5/6</b><span>doğru</span></div></div>
    <p class="lead">Bir kelimeyi genelde bu sürede buldun.</p>

    <div class="learn"><div class="lt">Bugün öğrendiğin</div><div class="lc"><b>Boş kartı en az sayan arılar</b><span>Howard ve ark. · Science 2018 · <em>PMID 29880690</em></span></div><div class="lc"><b>17 saat sonrası için alet seçen kuzgunlar</b><span>Kabadayi ve Osvath · Science 2017 · <em>PMID 28706072</em></span></div></div>
    <div class="gel"><div class="h"><span>Kelime bulma süresi</span><b>Başlangıç · 3/8 gün</b></div><div class="seg">${[0,1,2,3,4,5,6,7].map((i) => `<i class="${i < 3 ? 'on' : ''}"></i>`).join('')}</div></div>
    <div class="sp"></div><button class="btn">Tamam</button></div>`,

const ring = (sec, frac) => `<div class="ring" style="--p:${frac}"><b>${sec}</b></div>`
const near = ['arılarına', 'arılar']
Object.assign(V, {
  'search-a': () => `${status}<div class="body">${topBar(1, 1)}<div class="seek"><div class="sk"><div class="lbl">Bu kelimeyi bul</div><div class="w">kartı</div></div>${ring(12, .6)}</div>${paper(X).replace('class="paper"', 'class="paper lg"')}<button class="btn ghost">Metinde yok</button></div>`,
  'search-b': () => `${status}<div class="body">${topBar(1, 1)}<div class="paper tabbed"><div class="tab"><span>${lens}</span><b>kartı</b><i>12 sn</i></div><div class="tline"><i style="width:60%"></i></div>${paper(X).replace('<div class="paper">', '').replace(/<\/div>$/, '')}</div><button class="btn ghost">Metinde yok</button></div>`,
  'search-c': () => `${status}<div class="body">${topBar(1, 1)}<div class="hero"><div class="lbl">Bu kelimeyi bul</div><div class="hw">kartı</div><div class="hrow"><div class="hl"><i style="width:60%"></i></div><b>12</b></div></div>${paper(X).replace('class="paper"', 'class="paper bar"')}<button class="btn ghost">Metinde yok</button></div>`,
  'absent-a': () => `${status}<div class="body">${topBar(4, 3)}${seek('arıya', 30)}${paper(X, {}, 'arı').replace('class="paper"', 'class="paper dim"')}<div class="sheet"><div class="big-ok">${check}</div><div><b>Doğru, metinde yok.</b><p>Benzer kelimeler vardı:</p><div class="chips">${near.map((w) => `<span>${w}</span>`).join('')}</div></div></div></div>`,
  'absent-b': () => `${status}<div class="body">${topBar(4, 3)}<div class="seek ok"><div class="lens">${check}</div><div class="sk"><div class="lbl">Doğru, metinde yok</div><div class="w">arıya</div></div><div class="time"><b>Yok</b></div><div class="t" style="width:30%"></div></div>${paper(X, {}, 'arı').replace('class="paper"', 'class="paper thick"')}<div class="small" style="text-align:center">Kesik çizgili kelimeler benzerdi ama aynı değildi.</div></div>`,
  'absent-c': () => `${status}<div class="body">${topBar(4, 3)}${seek('arıya', 30, '', 'ok')}${paper(X, {}, 'arı').replace('class="paper"', 'class="paper boxed"')}<div class="toast">${check}<div><b>Doğru, metinde yok.</b> <span>Benzerler kutuda.</span></div></div></div>`,
  'result-a': () => `${status}<div class="body">
    <div class="top"><div class="x">${close}</div></div>
    <div><div class="ey">Tur bitti</div><div class="big" style="margin-top:8px">3,0<small>sn</small></div><p class="lead" style="margin-top:6px">Kelimelerin yarısını bundan hızlı buldun.</p></div>
    <div class="best"><span>En hızlı bulduğun</span><b>papağanlarda</b><i>1,9 sn</i></div>
    <div class="stats"><div class="stat"><b>4/5</b><span>kelime bulundu</span></div><div class="stat"><b>1/1</b><span>doğru “Yok”</span></div><div class="stat"><b>1</b><span>yanlış dokunuş</span></div></div>
    <div class="gel"><div class="h"><span>Kelime bulma süresi</span><b>Başlangıç · 3/8 gün</b></div><div class="seg">${[0,1,2,3,4,5,6,7].map((i) => `<i class="${i < 3 ? 'on' : ''}"></i>`).join('')}</div><div class="gs">8 gün sonra başlangıç ölçün çıkar; sonra her hafta onunla karşılaştırılır.</div></div>
    <div class="sp"></div><button class="btn">Tamam</button></div>`,
  'result-b': () => { const it = [['papağanlarda', 1.9], ['kartı', 2.8], ['Yok', 'ok'], ['aleti', 3.1], ['kuzgunlarda', null], ['maymunlara', 4.0]]; return `${status}<div class="body">
    <div class="top"><div class="x">${close}</div></div>
    <div><div class="ey">Tur bitti</div><div class="big" style="margin-top:8px">3,0<small>sn</small></div><p class="lead" style="margin-top:6px">Kelimelerin yarısını bundan hızlı buldun.</p></div>
    <div class="bars">${it.map(([w, v]) => `<div class="bar1"><div class="col"><i class="${v === 'ok' ? 'okb' : v == null ? 'miss' : ''}" style="height:${v === 'ok' ? 30 : v == null ? 8 : Math.round(v / 4.5 * 100)}%"></i></div><b>${v === 'ok' ? '✓' : v == null ? '–' : v.toFixed(1).replace('.', ',')}</b><span>${w}</span></div>`).join('')}</div>
    <div class="gel"><div class="h"><span>Kelime bulma süresi</span><b>Başlangıç · 3/8 gün</b></div><div class="seg">${[0,1,2,3,4,5,6,7].map((i) => `<i class="${i < 3 ? 'on' : ''}"></i>`).join('')}</div><div class="gs">8 gün sonra başlangıç ölçün çıkar; sonra her hafta onunla karşılaştırılır.</div></div>
    <div class="facts"><div class="fact"><b>Sıfırı en küçük sayan arılar</b><span>Howard ve ark. · Science 2018 · PMID 29880690</span></div><div class="fact"><b>17 saat sonrası için seçen kuzgunlar</b><span>Kabadayi ve Osvath · Science 2017 · PMID 28706072</span></div></div>
    <div class="sp"></div><button class="btn">Tamam</button></div>` },
  'result-c': () => `${status}<div class="body">
    <div class="top"><div class="x">${close}</div></div>
    <div class="rhero"><div><div class="ey">Tur bitti</div><div class="big" style="margin-top:6px">3,0<small>sn</small></div></div><div class="rk"><b>5/6</b><span>doğru</span></div></div>
    <p class="lead">Kelimelerin yarısını bundan hızlı buldun.</p>
    <div class="learn"><div class="small">Bugün öğrendiğin</div><div class="lc"><b>Arılar boş kartı en küçük saydı</b><span>Howard ve ark. · Science 2018 · PMID 29880690</span></div><div class="lc"><b>Kuzgunlar 17 saat sonrası için seçebildi</b><span>Kabadayi ve Osvath · Science 2017 · PMID 28706072</span></div></div>
    <div class="gel"><div class="h"><span>Kelime bulma süresi</span><b>Başlangıç · 3/8 gün</b></div><div class="seg">${[0,1,2,3,4,5,6,7].map((i) => `<i class="${i < 3 ? 'on' : ''}"></i>`).join('')}</div></div>
    <div class="sp"></div><button class="btn">Tamam</button></div>`,
})
document.getElementById('app').innerHTML = (V[VV ? S + '-' + VV : S] || V.intro)()
